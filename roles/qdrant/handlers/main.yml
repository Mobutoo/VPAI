---
# qdrant — handlers

- name: Restart qdrant stack
  community.docker.docker_compose_v2:
    project_src: "/opt/{{ project_name }}"
    files:
      - docker-compose-infra.yml
    services:
      - qdrant
    state: present
    recreate: always
  become: true
  when: not (common_molecule_mode | default(false))
