    # C1 (revue 2026-08-03) : map('lookup', 'ansible.builtin.file') n'existe
    # pas comme filtre Jinja (lookup est une fonction globale, pas un filtre
    # — et l'ordre des arguments serait de toute facon inverse). Cette tache
    # partait en erreur de templating : les 5 assertions ci-dessous n'ont
    # JAMAIS tourne vertes. Fix : ansible.builtin.slurp (execute sur la
    # cible, jamais le controller) en boucle, contenu agrege puis
    # assertion `is search(...)`.
    - name: Slurp all archived Instagram-adapter manifests from the TARGET host (C1 fix)
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ instagram_manifests.files }}"
      register: instagram_manifests_slurped

    - name: Assert all 9 non-carousel/non-dedup Instagram scenarios archived a manifest with the expected reason
      vars:
        _instagram_joined: "{{ instagram_manifests_slurped.results | map(attribute='content') | map('b64decode') | join('\n') }}"
      ansible.builtin.assert:
        that:
          # 7 depuis cycle 1/2 (handle/mismatch/invalid_range/blocked/
          # username_not_allowlisted/range_upper_too_large) + 2 nouvelles
          # (R5/cycle 3 : username_absent + instagram_empty_result_no_prior_delivery).
          # dedup-a (job A du scenario R1) est un SUCCES (done) et n'est
          # JAMAIS snapshotte sous rejects/ (M-B) — n'entre pas dans ce compte.
          - instagram_manifests.matched >= 9
          - _instagram_joined is search('handle_not_allowlisted')
          - _instagram_joined is search('handle_mismatch')
          - _instagram_joined is search('invalid_range')
          - >-
            _instagram_joined is search('"state": "blocked"')
          - _instagram_joined is search('blocked:challenge_required')
          # H4 (revue 2026-08-03) : le tiers /p/impostor-post/ est rejete
          # APRES acquisition (sidecar username != handle autorise), rien
          # livre.
          - _instagram_joined is search('username_not_allowlisted')
          # H-C (revue 2026-08-03, cycle 2) : range "1-99999" rejete AVANT
          # tout appel gallery-dl (jamais une deadline demesuree).
          - _instagram_joined is search('range_upper_too_large')
          # R5/M-G (revue 2026-08-03, cycle 3) : sidecar sans username ->
          # retriable (InstagramUsernameUnavailable), jamais terminal
          # directement — distinct de username_not_allowlisted ci-dessus (R3).
          - _instagram_joined is search('username_absent')
          # R5/R1 (revue 2026-08-03, cycle 3) : resultat vide SANS livraison
          # anterieure sur cette url -> echec REEL, jamais un faux `done`
          # global (cause racine R1).
          - _instagram_joined is search('instagram_empty_result_no_prior_delivery')

    - name: Find the delivered Instagram carousel bundle (multi-media — B1 atomic publish)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: "carousel_*.jpg"
        recurse: true
      register: carousel_media

    - name: Assert the full carousel (3 media) was delivered as ONE bundle, sidecars excluded
      ansible.builtin.assert:
        that:
          - carousel_media.matched == 3
          - (carousel_media.files | map(attribute='path') | map('dirname') | unique | length) == 1

    - name: Read the carousel bundle manifest
      ansible.builtin.slurp:
        src: "{{ (carousel_media.files[0].path | dirname) }}/manifest.json"
      register: carousel_manifest_raw

    - name: Assert the manifest lists all 3 files with metadata, and no raw *.json sidecar leaked into the bundle
      vars:
        _carousel_manifest: "{{ carousel_manifest_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - _carousel_manifest.state == "done"
          - _carousel_manifest.files | length == 3
          - _carousel_manifest.files | selectattr('metadata.username', 'equalto', 'operator_test') | list | length == 3
          # M8 (revue 2026-08-03) : verifie APRES l'enforcement H4 (tous les
          # usernames sidecar == handle autorise) -> allowlist_scope passe de
          # "input_url_only" a "verified_username".
          - _carousel_manifest.allowlist_scope == "verified_username"
          # H6 (revue 2026-08-03) : range_default molecule = "1-5" (converge.yml),
          # 3 medias livres < borne haute 5 -> partial=true. C'est un
          # HEURISTIQUE CONSERVATEUR documente (delivered < range_upper), PAS
          # une preuve de perte : un compte reel ayant moins de posts que la
          # borne haute demandee produira toujours partial=true. Ne JAMAIS
          # lire "bundle complet" depuis ce champ (CANARY-5 gate wording).
          - _carousel_manifest.partial == true
          - _carousel_manifest.range_upper == 5
          - _carousel_manifest.delivered_count == 3
          # M-A (revue 2026-08-03, cycle 2) : partial est desormais calcule
          # sur le SPAN (upper-lower+1), pas seulement upper — range_lower est
          # expose pour rendre ce calcul auditable depuis le manifeste, et
          # partial_reason distingue explicitement ce cas ("compte a moins de
          # posts que demande") du cas H-B (dedup cross-job, "archive_overlap").
          - _carousel_manifest.range_lower == 1
          - _carousel_manifest.partial_reason == "fewer_items_than_requested"

    - name: Find any leftover metadata sidecar in the delivered carousel bundle (must be zero — enriched into manifest, never shipped raw)
      ansible.builtin.find:
