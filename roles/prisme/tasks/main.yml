---
- name: Validate Prisme deployment pins and capacity variables
  ansible.builtin.assert:
    that:
      - prisme_image_digest is match('^sha256:[a-f0-9]{64}$')
      - "'@sha256:' in prisme_knowledge_embedding_image"
      - "'@sha256:' in prisme_db_proxy_image"
      - prisme_db_proxy_backend_ip == "172.20.2.240"
      - prisme_service_backend_ip == "172.20.2.241"
      - prisme_web_memory_limit is defined
      - prisme_db_proxy_memory_reservation is defined
      - vault_prisme_session_token is defined
      - vault_prisme_session_token | length >= 32
      - vault_prisme_operator_token is defined
      - vault_prisme_operator_token | length >= 32
      - vault_prisme_metrics_token is defined
      - vault_prisme_metrics_token | length >= 32
      - vault_prisme_embedding_token is defined
      - vault_prisme_embedding_token | length >= 32
      - vault_prisme_fetcher_token is defined
      - vault_prisme_fetcher_token | length >= 32
      - vault_prisme_registry_pull_token is defined
      - vault_prisme_registry_pull_token | length >= 40
      - not (prisme_karakeep_enabled | bool) or vault_prisme_karakeep_token is defined
    fail_msg: "Prisme image digests or authoritative capacity/IP variables are missing"
    quiet: true
  when: prisme_enabled | bool
  tags: [prisme]

- name: Provision the isolated Prisme LiteLLM virtual key and daily budget
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --env
      - "PRISME_LITELLM_KEY={{ prisme_litellm_key }}"
      - --env
      - "PRISME_LITELLM_BUDGET={{ prisme_litellm_daily_budget }}"
      - "{{ project_name }}_litellm"
      - python
      - -c
      - |
        import json, os, urllib.request, urllib.error
        base = "http://127.0.0.1:4000"
        headers = {
          "Authorization": "Bearer " + os.environ["LITELLM_MASTER_KEY"],
          "Content-Type": "application/json",
        }
        body = {
          "key": os.environ["PRISME_LITELLM_KEY"],
          "key_alias": "prisme-production",
          "models": ["*"],
          "max_budget": float(os.environ["PRISME_LITELLM_BUDGET"]),
          "budget_duration": "1d",
          "metadata": {"service": "prisme", "allocation": "shared-global-cap"},
        }
        request = urllib.request.Request(
          base + "/key/generate", data=json.dumps(body).encode(), headers=headers, method="POST"
        )
        try:
          response = urllib.request.urlopen(request, timeout=20)
        except urllib.error.HTTPError as error:
          if error.code not in (400, 409):
            raise
          update = urllib.request.Request(
            base + "/key/update",
            data=json.dumps(body).encode(),
            headers=headers,
            method="POST",
          )
          response = urllib.request.urlopen(update, timeout=20)
        payload = json.load(response)
        if float(payload.get("max_budget") or 0) != float(os.environ["PRISME_LITELLM_BUDGET"]):
          raise RuntimeError("PrismeLiteLLMBudgetMismatch")
        print(json.dumps({
          "key_alias": payload.get("key_alias"),
          "max_budget": payload.get("max_budget"),
          "budget_duration": payload.get("budget_duration"),
          "spend": payload.get("spend"),
        }, sort_keys=True))
  register: prisme_litellm_key_result
  changed_when: false
  become: true
  no_log: true
  when:
    - prisme_enabled | bool
    - not (common_molecule_mode | default(false) | bool)
  tags: [prisme]

- name: Authenticate Docker to private Seko registry
  community.docker.docker_login:
    registry_url: "{{ prisme_registry_server }}"
    username: "{{ prisme_registry_user }}"
    password: "{{ vault_prisme_registry_pull_token }}"
    reauthorize: false
  become: true
  no_log: true
  when: prisme_enabled | bool
  tags: [prisme]

- name: Pull immutable Prisme images
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
    state: present
  loop:
    - "{{ prisme_image_repository }}@{{ prisme_image_digest }}"
    - "{{ prisme_knowledge_embedding_image }}"
    - "{{ prisme_db_proxy_image }}"
  become: true
  when: prisme_enabled | bool
  tags: [prisme]

- name: Create isolated Prisme connector network
  community.docker.docker_network:
    name: "{{ prisme_connector_network }}"
    internal: true
    state: present
  become: true
  when:
    - prisme_enabled | bool
    - not (common_molecule_mode | default(false) | bool)
  tags: [prisme]

- name: Inspect backend network before reserving Prisme IPs
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ prisme_backend_network }}"
      - --format
      - "{% raw %}{{json .Containers}}{% endraw %}"
  register: prisme_backend_network_state
  changed_when: false
  when:
    - prisme_enabled | bool
    - not (common_molecule_mode | default(false) | bool)
  tags: [prisme]

- name: Refuse occupied Prisme backend IPs
  ansible.builtin.assert:
    that:
      - prisme_db_proxy_backend_ip not in prisme_backend_network_state.stdout
      - prisme_service_backend_ip not in prisme_backend_network_state.stdout
    fail_msg: "Prisme fixed backend IP collision: G0 IP decision required"
    quiet: true
  when:
    - prisme_enabled | bool
    - not (common_molecule_mode | default(false) | bool)
  tags: [prisme]

- name: Create Prisme directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0750"
  loop:
    - "{{ prisme_config_dir }}"
    - "{{ prisme_data_dir }}"
    - "{{ prisme_backup_dir }}"
  become: true
  when: prisme_enabled | bool
  tags: [prisme]

- name: Create Prisme model directory owned by the sparse service UID
  ansible.builtin.file:
    path: "{{ prisme_model_dir }}"
    state: directory
    # 2102:2100 = sparse-query container user (docker-compose.yml.j2); the cap_drop:ALL
    # bootstrap and the read-only sidecar both need plain POSIX access to this tree.
    owner: "2102"
    group: "2100"
    mode: "0750"
  become: true
  when: prisme_enabled | bool
  tags: [prisme]

- name: Check exact Prisme sparse model snapshot
  ansible.builtin.stat:
    path: "{{ prisme_sparse_model_config }}"
  register: prisme_sparse_model_state
  # The model tree is owned by the sparse service UID (2102, mode 0750): the SSH
  # user cannot traverse it, so the existence probe must run privileged.
  become: true
  when:
    - prisme_enabled | bool
    - not (common_molecule_mode | default(false) | bool)
  tags: [prisme]

- name: Bootstrap exact Prisme sparse model without persisting the token
  when:
    - prisme_enabled | bool
    - not (common_molecule_mode | default(false) | bool)
    - not prisme_sparse_model_state.stat.exists
  tags: [prisme]
  block:
    - name: Create ephemeral sparse model downloader
      ansible.builtin.tempfile:
        state: file
        suffix: .py
      register: prisme_sparse_downloader
      changed_when: false

    - name: Render sparse model downloader
      ansible.builtin.template:
        src: download-sparse-model.py.j2
        dest: "{{ prisme_sparse_downloader.path }}"
        # World-readable on purpose: no secret in the rendered script (token stays in env)
        # and the cap_drop:ALL container loses CAP_DAC_OVERRIDE, so root inside cannot
        # read a 0600 file owned by the SSH user (REX flash-infra 2026-03-22).
        mode: "0644"
      changed_when: false

    - name: Download pinned sparse model
      community.docker.docker_container:
        name: prisme-sparse-bootstrap
        image: "{{ prisme_hf_downloader_image }}"
        state: started
        user: "2102:2100"
        detach: false
        cleanup: true
        command: >-
          sh -c "python -m pip install --disable-pip-version-check --no-cache-dir
          huggingface_hub=={{ prisme_huggingface_hub_version }} && python /download.py"
        env:
          HF_TOKEN: "{{ vault_prisme_embedding_token }}"
          # read_only rootfs: route pip's implicit --user install onto the /tmp tmpfs
          HOME: "/tmp"
          PYTHONUSERBASE: "/tmp/python-user"
        volumes:
          - "{{ prisme_model_dir }}:/cache"
          - "{{ prisme_sparse_downloader.path }}:/download.py:ro"
        read_only: true
        tmpfs:
          - "/tmp:rw,noexec,nosuid,nodev,size=256m"
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
      become: true
      no_log: true
  always:
    - name: Remove ephemeral sparse model downloader
      ansible.builtin.file:
        path: "{{ prisme_sparse_downloader.path | default('/run/prisme-downloader-absent') }}"
        state: absent
      no_log: true

- name: Render Prisme environment
  ansible.builtin.template:
    src: prisme.env.j2
    dest: "{{ prisme_config_dir }}/prisme.env"
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0600"
  become: true
  no_log: true
  when: prisme_enabled | bool
  tags: [prisme]

- name: Render Prisme DB proxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ prisme_config_dir }}/haproxy.cfg"
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0640"
  become: true
  when: prisme_enabled | bool
  tags: [prisme]

- name: Render Prisme compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ prisme_config_dir }}/docker-compose.yml"
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0640"
  become: true
  when: prisme_enabled | bool
  tags: [prisme]

- name: Deploy Prisme only after deployment gates
  community.docker.docker_compose_v2:
    project_src: "{{ prisme_config_dir }}"
    files: [docker-compose.yml]
    state: present
    pull: never
    recreate: always
  become: true
  when:
    - prisme_enabled | bool
    - prisme_deploy_enabled | bool
  tags: [prisme]
