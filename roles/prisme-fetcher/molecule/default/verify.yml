    # R5 (revue 2026-08-03, cycle 3) : job A du scenario dedup cross-job
    # (H-B/R1) — 1re livraison sur cette url, amorce l'archive persistante.
    # Traite dans CETTE meme passe (pass 2, avec tous les autres scenarios
