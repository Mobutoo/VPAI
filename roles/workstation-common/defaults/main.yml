---
# workstation-common — defaults

# Paquets de base pour le workstation Pi (Ubuntu Server 24.04 ARM64)
workstation_packages:
  - curl
  - wget
  - jq
  - gnupg
  - ca-certificates
  - python3-pip
  - unzip
  - htop
  - ncdu
  - tmux
  - lsb-release
  - net-tools
  - rsync
  - git
  - build-essential
  - apt-transport-https
# earlyoom N'EST PAS ici (REVUE NO-GO finding M4) : il était installé
# inconditionnellement via cette liste alors que sa config est conditionnée
# par workstation_earlyoom_enabled -> au 1er `apt install`, avant que la
# config soit posée, earlyoom tournait avec les défauts amont (-m 10 -s 10,
# aucun avoid) et un `enabled: false` ne l'aurait PAS arrêté. Installé
# désormais par une tâche apt dédiée conditionnée par
# workstation_earlyoom_enabled (tasks/main.yml), avec branche inverse
# (stopped + disabled) si le drapeau passe à false.

workstation_hostname: "{{ workstation_pi_hostname | default('workstation-pi') }}"
workstation_user: "{{ workstation_pi_user | default('pi') }}"
workstation_locale: "{{ locale }}"
workstation_timezone: "{{ timezone }}"

# Docker config Pi (ARM64 — pas de swap limit kernel flag)
workstation_docker_log_max_size: "10m"
workstation_docker_log_max_file: "3"

# Node.js version (NodeSource LTS)
workstation_nodejs_major: "22"

# Claude Code CLI — pinne apres premier deploy valide (2026-02-20)
# Auth OAuth Max Plan : manuelle une seule fois (claude auth sur le Pi)
workstation_claude_code_version: "2.1.49"

# Repertoire projets (SSD 256 Go)
workstation_projects_dir: "/home/{{ workstation_pi_user | default('pi') }}/projects"
workstation_base_dir: "/opt/workstation"

# Sous-repertoires de /opt/workstation
workstation_base_dirs:
  - configs
  - configs/caddy
  - data
  - data/caddy
  - logs

# --- Asset Storage (Phase 13) ---
# Structure locale S3-like pour les assets générés (images, vidéos, audio)
workstation_assets_base: "/opt/workstation/data/assets"
workstation_assets_dirs:
  - images
  - images/comfyui
  - images/seedream
  - images/dalle
  - videos
  - videos/remotion
  - videos/seedance
  - videos/veo
  - audio
  - metadata

# sysctl adapte Pi (pas de swappiness agressif, ARM64)
workstation_sysctl_settings:
  vm.swappiness: 10
  fs.file-max: 100000

# NTP
workstation_ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"

# UFW — autoriser Tailscale CIDR + LAN seulement
workstation_ufw_allow_cidrs:
  - "{{ vpn_network_cidr }}"    # Tailscale mesh (100.64.0.0/10)
  - "192.168.0.0/16"            # LAN local
  - "10.0.0.0/8"                # LAN alternatif (sous-reseaux prives)

# --- Résilience réseau (REX 2026-06-05 panne SSH waza) ---
# Cause: worker mémoire non-borné -> OOM global -> systemd-networkd affamé ->
# bail DHCP eth0 perdu (RTM_DELROUTE gw) -> jamais re-DISCOVER -> tailscale
# ENETUNREACH -> SSH (mesh) mort ~6h30. Box/WAN sains (ewutelo resté en ligne).
# Réf: docs/rex/REX-SESSION-2026-06-05-waza-ssh-dhcp-oom.md
#
# P1 — protéger le stack réseau de l'OOM-killer (jamais 1ère victime).
workstation_net_protect_oom: true
workstation_net_oom_score: -900            # plage [-1000,1000]; bas = épargné
workstation_net_protected_units:
  - systemd-networkd
  - tailscaled
  - systemd-resolved   # M2 (revue NO-GO 2026-07-27): DNS coupé = mayi.ewutelo.cloud injoignable (R7)
#
# P3 — watchdog passerelle: si la default route/gateway tombe durablement,
# relance DHCP (networkctl reconfigure) puis tailscaled. Auto-réparation headless.
workstation_net_watchdog_enabled: true
workstation_net_watchdog_iface: "eth0"
workstation_net_watchdog_ping_count: 3
workstation_net_watchdog_ping_timeout: 3   # secondes par ping
workstation_net_watchdog_fallback_target: "1.1.1.1"   # 2e cible pour confirmer la panne
workstation_net_watchdog_interval: "2min"  # OnUnitActiveSec du timer
workstation_net_watchdog_bin: "/opt/workstation/bin/net-watchdog.sh"
# Escalade reboot si la recovery réseau échoue durablement (headless 10j).
# Guardé: reboot SEULEMENT après N échecs consécutifs + cooldown anti-boucle.
workstation_net_watchdog_reboot_on_fail: true
workstation_net_watchdog_fail_threshold: 15        # échecs consécutifs avant reboot (15 × interval 2min ≈ 30min)
workstation_net_watchdog_reboot_cooldown: 3600     # secondes mini entre 2 reboots watchdog (anti boot-loop)

# --- Watchdog matériel (freeze / kernel hang headless) ---
# RPi5 expose /dev/watchdog (RP1). systemd le "pet" tant qu'il est vivant ;
# si PID1 gèle plus de RuntimeWatchdogSec, le SoC reboote tout seul.
# Couvre le cas "freeze total" qu'aucun watchdog logiciel ne peut traiter.
workstation_hw_watchdog_enabled: true
workstation_hw_watchdog_runtime_sec: "15s"         # délai sans "pet" avant reboot matériel
workstation_hw_watchdog_reboot_sec: "10min"        # délai max d'un shutdown/reboot avant kill matériel

# --- Couche 1 — earlyoom (filet OOM global manquant) ---
# REX 2026-07-27 (4 hard-resets watchdog: 17/07, 23/07, 27/07 x2): RAM+swapfile
# 8G chroniquement saturés 10-16h/j, AUCUNE politique OOM (ni systemd-oomd ni
# earlyoom installés) -> le reclaim noyau n'aboutit jamais (livelock, pgpgin
# ~20 000/s, majflt ~78/s) -> PID1 non ordonnançable -> RuntimeWatchdogSec
# (15s) ne peut plus être "pété" -> le watchdog matériel BCM2835 hard-reset
# le Pi. Zéro ligne OOM dans `journalctl -k` sur les 3 derniers boots : le
# noyau ne se déclenche jamais tout seul dans ce livelock.
# systemd-oomd écarté (choix arbitré) : il dépend du manager systemd
# ordonnançable — précisément ce qui échoue dans ce scénario — et son
# déclencheur swap se déclencherait en permanence sur cette machine (swap
# chroniquement plein, ce n'est pas hors-norme ici). earlyoom fait
# mlockall(), reste résident, et poll /proc/meminfo directement : indépendant
# de l'ordonnanceur systemd pour sa boucle de décision.
workstation_earlyoom_enabled: true
# REVUE NO-GO 2026-07-27 (finding B1 — filet inerte, corrigé) : earlyoom
# applique un ET entre la condition mémoire (-m) et la condition swap (-s) —
# il ne tue QUE si les deux sont sous seuil. Preuve : au crash du 27/07,
# `sar -r` donnait MemAvailable=13,6% à 17:30, AU-DESSUS du seuil SIGTERM
# 8% d'origine -> earlyoom n'aurait pas tiré. Aggravant : le cap
# MemorySwapMax=2G posé en Couche 2 empêche désormais de remplir le swap
# (SwapFree observé ~66% en régime nominal) -> la condition swap devient
# quasi inatteignable, ce qui rend le ET structurellement mort.
# Correctif : -s 100 (documenté par le man earlyoom comme LA façon de faire
# ignorer le swap : "Processes are killed once available memory drops below
# the configured minimum, no matter how much swap is free") -> earlyoom
# devient purement piloté par la RAM disponible.
# -m 10,5 : SIGTERM à 10% MemAvailable (~1,6 Go), SIGKILL à 5% (~800 Mo).
# `sar` montre que waza a passé des heures à 1,6-2,2 Go de kbavail les jours
# de crash -> c'est précisément la spirale de mort, y tirer est le
# comportement VOULU, pas un faux positif. (-m 15,8 suggéré par la revue
# non retenu : trop de faux positifs en régime chargé normal, et les caps
# cgroup Couche 2 agissent déjà avant ce seuil.)
workstation_earlyoom_mem_percent: "10,5"
workstation_earlyoom_swap_percent: "100,100"
# Jamais tuer ce qui maintient l'accès distant (cohérent avec oom-protect.conf.j2
# qui met déjà OOMScoreAdjust=-900 sur systemd-networkd, systemd-resolved et
# tailscaled). --avoid ne fait QUE retrancher 300 au oom_score (pondération,
# PAS une garantie de survie — la vraie protection est OOMScoreAdjust=-900/
# -1000, cf. oom-protect.conf.j2 / earlyoom-oom-protect.conf.j2). REVUE NO-GO
# (finding M1) : /proc/PID/comm est tronqué à 15 caractères visibles
# (TASK_COMM_LEN=16 avec le NUL) -> "systemd-networkd" (16 car.) apparaît
# réellement comme comm="systemd-network" et "systemd-resolved" (16 car.)
# comme comm="systemd-resolve". Vérifié en direct (cat /proc/$(pidof
# systemd-networkd)/comm). Piège qui se re-tendra sur tout futur nom de 16+
# caractères -> toujours vérifier le comm réel, pas le nom de l'unité.
workstation_earlyoom_avoid_regex: '^(sshd|systemd|systemd-network|systemd-logind|systemd-resolve|tailscaled|dbus-daemon|earlyoom)$'
workstation_earlyoom_report_interval_sec: 3600   # 1 rapport mémoire/heure max, évite de spammer le journal
workstation_earlyoom_notify_dbus: true            # -n : notification d-bus/journal au moment du kill
workstation_earlyoom_oom_score_adjust: -1000      # earlyoom ne doit jamais être la victime de son propre filet
# REVUE NO-GO (finding H1) : --prefer SUPPRIMÉ. earlyoom matche --prefer/
# --avoid sur /proc/PID/comm (tronqué, voir ci-dessus), jamais sur la ligne
# de commande complète. Vérifié : index.py et mcp_search.py ont comm=python
# -> jamais matchés par l'ancien pattern. Seul "node" matchait, et le +300
# de --prefer désignait alors un petit process node (~75 Mio) au lieu du
# vrai gros consommateur -> contre-productif. Le bon levier de ciblage est
# OOMScoreAdjust= sur les units systemd (déjà en place et correct sur
# llamaindex-memory-worker = 1000, la cible voulue).

# --- Couche 2 — plafond mémoire de user@1000.service ---
# REX 2026-07-27: user-1000.slice (sessions SSH/tmux/Claude Code) était
# illimitée (MemoryMax=infinity), y compris les scopes tmux-spawn-*.scope :
# N sessions Claude Code peuvent y spawner chacune un mcp_search.py ~1 Go
# sans plafond ni sur la taille ni sur le nombre (3 process = 3,1 Go
# observés 10 min après un boot). Un throttle (MemoryHigh) puis un kill
# CONTRÔLÉ est infiniment préférable au livelock de reclaim qui a fini par
# déclencher le hard-reset watchdog. llamaindex-memory-worker (unit systemd
# --user, MemoryMax=4G) vit DANS user@1000.service — ses 4G restent inclus
# dans ce budget, c'est voulu.
# REVUE NO-GO (finding M6) : le cap posait initialement le drop-in sur
# user-1000.slice lui-même. Cartographie cgroup vérifiée : 100% de la
# consommation vit dans user@1000.service (le manager systemd utilisateur :
# worker, scopes tmux, claude, MCP). Or les SESSIONS SSH INTERACTIVES
# FRAÎCHES vivent dans session-N.scope, un FRÈRE de user@1000.service sous
# user-1000.slice — donc soumises au même plafond de slice sans y
# contribuer. Correctif : le drop-in cible désormais user@1000.service
# directement ([Service], pas [Slice]) -> effet identique sur les
# consommateurs réels, mais toute nouvelle session SSH reste hors du cgroup
# contraint -> accès de secours garanti par construction (cohérent avec la
# doctrine anti-lockout de handlers/main.yml).
# REVUE NO-GO (finding M5) : mesuré 15 min après déploiement en régime
# NOMINAL avec l'ancien MemorySwapMax=2G -> memory.swap.current = 99,98% du
# cap, memory.events "high" déjà franchi >1800 fois. Entre MemoryHigh=8G et
# MemoryMax=10G, le cgroup ne pouvait plus dégager de pages anonymes (swap
# plein) -> il ne recyclait que des pages fichier -> réinjection de code ->
# le motif majflt de l'incident, confiné mais avec la même contention I/O
# NVMe. Le swap n'est pas l'ennemi, c'est le reclaim SANS ISSUE qui l'est :
# MemorySwapMax=4G donne une soupape, et MemoryHigh=9G/MemoryMax=10G
# raccourcit la fenêtre de throttle (9->10G au lieu de 8->10G).
workstation_user_slice_memory_guard_enabled: true
workstation_user_slice_uid: 1000
workstation_user_slice_memory_high: "9G"
workstation_user_slice_memory_max: "10G"
workstation_user_slice_memory_swap_max: "4G"

# --- Intégrité FS après coupure de courant brutale ---
# fsck.repair=yes : répare automatiquement l'ext4 au boot si le FS est sale
# (coupure secteur) au lieu de tomber en prompt manuel -> évite un Pi bloqué.
workstation_fsck_repair_enabled: true
workstation_cmdline_path: "/boot/firmware/cmdline.txt"
