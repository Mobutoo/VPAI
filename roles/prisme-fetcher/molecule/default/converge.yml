---
- name: Converge Prisme fetcher
  hosts: all
  become: true
  vars:
    common_molecule_mode: true
    prisme_fetcher_enabled: true
    vault_prisme_fetcher_token: molecule-fetcher-token-32-characters
    # Pas de reseau WAN en molecule : l'allowlist n'ouvre QUE la loopback,
    # utilisee par verify.yml pour un scenario de succes reel (python3 -m
    # http.server local) et un scenario de rejet par redirection hors
    # allowlist (A9). Tout job vers un domaine WAN reste rejete.
    prisme_fetcher_allowed_domains: ["127.0.0.1"]
    # Les 3 scenarios verify.yml (A9) partagent le domaine "127.0.0.1" (ports
    # differents) : desactive le throttle inter-domaine pour ce test unique,
    # sinon le 2e/3e job serait silencieusement laisse "pending" par le rate
    # limiter au lieu d'etre traite dans le meme --once.
    prisme_fetcher_rate_limit_seconds: 0
    # --- Adapter Instagram (CANARY) : converge avec l'adapter actif pour
    # valider en molecule la partie deterministe (allowlist domaine+handle,
    # cookies Netscape, pipx pin, LoadCredential, env 0400) SANS jamais
    # atteindre le vrai Instagram. verify.yml pointe l'adapter vers un stub
    # fixture (challenge/carrousel simules) pour les scenarios qui invoquent
    # gallery-dl — le pipx install du role reste REEL (teste le pin exact).
    prisme_instagram_enabled: true
    prisme_instagram_allowed_handles: ["operator_test"]
    prisme_instagram_cookies_content: |
      # Netscape HTTP Cookie File
      .instagram.com	TRUE	/	TRUE	0	sessionid	molecule-fixture-session-value
    prisme_instagram_range_default: "1-5"
    # Rate-limit desactive en molecule pour la meme raison que
    # prisme_fetcher_rate_limit_seconds ci-dessus (plusieurs jobs Instagram
    # de test dans le meme --once).
    prisme_instagram_rate_limit_seconds: 0
    # Le worker appelle CE chemin (stub deploye par verify.yml) plutot que le
    # vrai binaire pipx : determinisme total (challenge/carrousel simules),
    # zero appel reseau vers Instagram. Le pin pipx reel (prisme_instagram_gallery_dl_version)
    # est teste independamment via le binaire installe a prisme_instagram_gallery_dl_pipx_bin_dir.
    prisme_instagram_gallery_dl_bin: /usr/local/libexec/prisme-fetcher-gallery-dl-stub
    # --- Contrat fetcher <-> control-plane Prisme (CANARY-1b) : verify.yml
    # deploie un stub HTTP loopback (127.0.0.1:8090) qui simule les deux
    # routes systeme (authorization/heartbeat). L'unite systemd (IPAddressAllow/
    # Deny) n'est PAS en jeu ici : verify.yml invoque le worker en --once
    # directement (command), hors systemd -- cf commentaire C1-bis plus bas
    # dans ce meme fichier pour la meme limite deja documentee sur
    # CREDENTIALS_DIRECTORY. Un run molecule vert ne prouve donc PAS la
    # joignabilite tailnet reelle (IPAddressAllow) : verifie separement au
    # deploiement (assert getent, tasks/main.yml) + a la mise en prod.
    prisme_instagram_api_base: "http://127.0.0.1:8090"
    prisme_instagram_tenant_id: "molecule-tenant"
    # Valeur par defaut du role conservee (pas besoin de la reduire) : chaque
    # `--once` demarre un process FRAIS (_INSTAGRAM_AUTH_STATE reinitialise a
    # checked_at=0.0), et time.monotonic() (horloge depuis le boot, jamais
    # depuis le lancement du process) est toujours tres largement superieur a
    # ce seuil des la 1re verification -> une verification fraiche est donc
    # TOUJOURS effectuee au tout premier passage de chaque invocation --once.
    prisme_instagram_authorization_poll_seconds: 20
    prisme_instagram_heartbeat_interval_seconds: 45
    # H2 (revue 2026-08-03, cycle 4) : seuil ABAISSE a 1 pour ce banc molecule
    # UNIQUEMENT -- chaque `--once` demarre un process FRAIS (compteur
    # _INSTAGRAM_CONTROL_PLANE_STATE remis a zero a chaque invocation), donc
    # accumuler plusieurs echecs CONSECUTIFS dans le meme process demanderait
    # plusieurs jobs Instagram DISTINCTS dans la MEME passe de scan -- ce que
    # le throttle par-passe (INSTAGRAM_AUTHORIZATION_POLL_SECONDS) empeche
    # deliberement (design : une seule verification reseau par passe, cf
    # commentaire au-dessus). Seuil=1 permet de prouver que l'evenement
    # instagram_control_plane_unreachable est bien emis des le seuil atteint,
    # sans changer la LOGIQUE testee (le routage H2 lui-meme est identique
    # quel que soit le seuil). Valeur par defaut du role (5) inchangee en
    # prod.
    prisme_instagram_control_plane_failure_threshold: 1
  pre_tasks:
    - name: Create service group
      ansible.builtin.group:
        name: prisme-fetcher
        system: true
    - name: Install acl (required for become_user to a nologin service account in verify.yml)
      ansible.builtin.apt:
        name: acl
        state: present
        update_cache: true
        cache_valid_time: 3600
  roles:
    - role: prisme-fetcher
