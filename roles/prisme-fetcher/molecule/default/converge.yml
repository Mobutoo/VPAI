---
- name: Converge Prisme fetcher
  hosts: all
  become: true
  vars:
    common_molecule_mode: true
    prisme_fetcher_enabled: true
    vault_prisme_fetcher_token: molecule-fetcher-token-32-characters
    # Pas de reseau WAN en molecule : l'allowlist n'ouvre QUE la loopback,
    # utilisee par verify.yml pour un scenario de succes reel (python3 -m
    # http.server local) et un scenario de rejet par redirection hors
    # allowlist (A9). Tout job vers un domaine WAN reste rejete.
    prisme_fetcher_allowed_domains: ["127.0.0.1"]
    # Les 3 scenarios verify.yml (A9) partagent le domaine "127.0.0.1" (ports
    # differents) : desactive le throttle inter-domaine pour ce test unique,
    # sinon le 2e/3e job serait silencieusement laisse "pending" par le rate
    # limiter au lieu d'etre traite dans le meme --once.
    prisme_fetcher_rate_limit_seconds: 0
  pre_tasks:
    - name: Create service group
      ansible.builtin.group:
        name: prisme-fetcher
        system: true
    - name: Install acl (required for become_user to a nologin service account in verify.yml)
      ansible.builtin.apt:
        name: acl
        state: present
        update_cache: true
        cache_valid_time: 3600
  roles:
    - role: prisme-fetcher
