---
# postgresql — handlers

- name: Restart postgresql stack
  community.docker.docker_compose_v2:
    project_src: "/opt/{{ project_name }}"
    files:
      - docker-compose-infra.yml
    services:
      - postgresql
    state: restarted
  become: true
  when: not (common_molecule_mode | default(false))

- name: Probe PostgreSQL before reload
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ project_name }}_postgresql"
      - pg_isready
      - -U
      - postgres
  become: true
  register: pg_probe
  changed_when: false
  failed_when: false
  listen: "Reload PostgreSQL config"

- name: Reload PostgreSQL config without restart
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - PGPASSWORD
      - "{{ project_name }}_postgresql"
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -c
      - "SELECT pg_reload_conf()"
  environment:
    PGPASSWORD: "{{ postgresql_password }}"
  become: true
  changed_when: true
  no_log: true
  when: pg_probe.rc == 0
  listen: "Reload PostgreSQL config"
