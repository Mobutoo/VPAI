---
- name: Verify Prisme fetcher
  hosts: all
  become: true
  tasks:
    - name: Inspect installed fetcher
      ansible.builtin.stat:
        path: /usr/local/libexec/prisme-fetcher
      register: fetcher

    - name: Verify executable and state directory
      ansible.builtin.assert:
        that:
          - fetcher.stat.executable
          - fetcher.stat.pw_name == 'root'

    - name: Read rendered unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/prisme-fetcher.service
      register: unit_raw

    - name: Verify unit opens AF_INET/AF_INET6, wires the environment file, and bounds resources (A2/A5/B5)
      ansible.builtin.assert:
        that:
          - "'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6' in (unit_raw.content | b64decode)"
          - "'EnvironmentFile=/etc/prisme-fetcher/env' in (unit_raw.content | b64decode)"
          - "'MemoryMax=1G' in (unit_raw.content | b64decode)"
          - "'TasksMax=64' in (unit_raw.content | b64decode)"
          - "'IPAddressDeny=' in (unit_raw.content | b64decode)"
          - "'InaccessiblePaths=' in (unit_raw.content | b64decode)"

    - name: Inspect environment file permissions
      ansible.builtin.stat:
        path: /etc/prisme-fetcher/env
      register: env_file

    - name: Verify environment file is 0600 root:root
      ansible.builtin.assert:
        that:
          - env_file.stat.exists
          - env_file.stat.mode == '0600'
          - env_file.stat.pw_name == 'root'
          - env_file.stat.gr_name == 'root'

    - name: Verify worker template compiles (python3 -m py_compile)
      ansible.builtin.command:
        cmd: python3 -m py_compile /usr/local/libexec/prisme-fetcher
      changed_when: false

    - name: Verify transfer script compiles under bash -n
      ansible.builtin.command:
        cmd: bash -n /usr/local/libexec/prisme-fetcher-transfer
      changed_when: false

    - name: Create fixture directory for the loopback HTTP test server (A9)
      ansible.builtin.file:
        path: /tmp/prisme-verify-http
        state: directory
        mode: "0755"

    - name: Write a known-content test payload
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-http/testfile.pdf
        content: "prisme-fetcher molecule verify fixture — A9 success scenario\n"
        mode: "0644"

    - name: Write a minimal HTTP redirect server (redirects OUTSIDE the allowlist)
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-http/redirect_server.py
        mode: "0644"
        content: |
          import http.server


          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(302)
                  self.send_header("Location", "http://example.invalid/blocked")
                  self.end_headers()

              def log_message(self, *args):
                  pass


          http.server.HTTPServer(("127.0.0.1", 8074), Handler).serve_forever()

    - name: Start the loopback HTTP test server as a transient systemd unit
      ansible.builtin.command:
        cmd: >-
          systemd-run --unit=prisme-verify-http --collect
          python3 -m http.server 8073 --directory /tmp/prisme-verify-http --bind 127.0.0.1
      changed_when: true

    - name: Start the redirect test server as a transient systemd unit
      ansible.builtin.command:
        cmd: systemd-run --unit=prisme-verify-redirect --collect python3 /tmp/prisme-verify-http/redirect_server.py
      changed_when: true

    - name: Wait for the loopback test servers to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 5
      loop:
        - 8073
        - 8074

    - name: Drop a fixture http job outside the allowlist (rejected before download)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-rejected.json
        content: |
          {"url": "https://example.invalid/some/asset.pdf", "adapter": "http", "note": "molecule verify: outside allowlist"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop a fixture http job INSIDE the allowlist against the loopback server (A9 success)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-accepted.json
        content: |
          {"url": "http://127.0.0.1:8073/testfile.pdf", "adapter": "http", "note": "molecule verify: success path"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop a fixture http job whose allowlisted URL redirects OUTSIDE the allowlist (A9 redirect rejection)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-redirect-rejected.json
        content: |
          {"url": "http://127.0.0.1:8074/", "adapter": "http", "note": "molecule verify: redirect leaves allowlist"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    # C1-bis (revue 2026-08-03, cycle 2) : $CREDENTIALS_DIRECTORY n'existe QUE
    # sous systemd (LoadCredential=) — un `ansible.builtin.command` direct
    # (comme les 3 taches --once ci-dessous) ne le peuple jamais, donc
    # instagram_cookies_path() levait systematiquement
    # instagram_cookies_unavailable pour TOUT job Instagram, quel que soit le
    # scenario (blocked/carousel/impostor n'ont jamais pu passer). Fixture :
    # meme layout que LoadCredential (fichier prive, nom == credential_name),
    # deposee UNE FOIS ici et reutilisee par les 3 taches --once via
    # `environment:`. Le fichier source (/etc/prisme-fetcher/instagram-cookies.txt)
    # est deja deploye par le role au converge (prisme_instagram_enabled: true).
    - name: Create CREDENTIALS_DIRECTORY fixture for --once oneshot runs (C1-bis)
      ansible.builtin.file:
        path: /tmp/prisme-verify-creds
        state: directory
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0700"

    - name: Deploy the Instagram cookies credential into the fixture CREDENTIALS_DIRECTORY (mirrors systemd LoadCredential's runtime layout)
      ansible.builtin.copy:
        src: /etc/prisme-fetcher/instagram-cookies.txt
        dest: /tmp/prisme-verify-creds/instagram-cookies
        remote_src: true
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0400"

    - name: Run one worker pass in oneshot mode
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
      become: true
      become_user: prisme-fetcher
      changed_when: false

    - name: Find the archived manifest for jobs rejected before/around download (A3 — no longer staged in work/)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/rejects
        patterns: "manifest.json"
        recurse: true
      register: rejected_manifests

    - name: Verify the fetcher's work/ directory holds no residual job workdir after a completed pass (A3)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/work
        file_type: directory
        recurse: false
      register: leftover_workdirs

    - name: Verify no workdir leak survives a completed scan (A3)
      ansible.builtin.assert:
        that:
          - leftover_workdirs.matched == 0

    # C1 (revue 2026-08-03) : lookup('ansible.builtin.file', ...) lit le
    # filesystem du CONTROLLER (waza), pas celui de la cible molecule (driver
    # docker, cf molecule.yml) — ces assertions lisaient des chemins
    # inexistants cote controller et n'ont jamais vraiment verifie le contenu
    # cible. Fix : ansible.builtin.slurp (execute sur la cible) en boucle,
    # contenu agrege puis assertion `is search(...)`.
    - name: Slurp both rejected manifests from the TARGET host (C1 fix)
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ rejected_manifests.files }}"
      register: rejected_manifests_slurped

    - name: Verify BOTH rejected jobs (domain-not-allowlisted + redirect-left-allowlist) archived a v2 manifest
      vars:
        _rejected_joined: "{{ rejected_manifests_slurped.results | map(attribute='content') | map('b64decode') | join('\n') }}"
      ansible.builtin.assert:
        that:
          - rejected_manifests.matched == 2
          - >-
            _rejected_joined is search('"schema": "prisme.source-bundle.v2"')
          - >-
            _rejected_joined is search('"state": "rejected"')

    - name: Verify one rejection reason is domain_not_allowlisted and the other redirect_left_allowlist
      vars:
        _rejected_joined: "{{ rejected_manifests_slurped.results | map(attribute='content') | map('b64decode') | join('\n') }}"
      ansible.builtin.assert:
        that:
          - _rejected_joined is search('domain_not_allowlisted')
          - _rejected_joined is search('redirect_left_allowlist')

    - name: Find the delivered bundle for the accepted job (A9 success — A1 regression guard)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: "testfile.pdf"
        recurse: true
      register: delivered_payload

    - name: Verify exactly one real media payload was delivered (never manifest.json mistaken for the media, cf A1)
      ansible.builtin.assert:
        that:
          - delivered_payload.matched == 1

    - name: Read the delivered bundle's manifest
      ansible.builtin.slurp:
        src: "{{ (delivered_payload.files[0].path | dirname) }}/manifest.json"
      register: delivered_manifest_raw

    - name: Compute the sha256 of the delivered media payload
      ansible.builtin.stat:
        path: "{{ delivered_payload.files[0].path }}"
        checksum_algorithm: sha256
      register: delivered_payload_stat

    - name: Verify the manifest's sha256 matches the actual delivered media (A1 regression guard — this is the check the manifest/media swap bug would have failed)
      ansible.builtin.assert:
        that:
          - (delivered_manifest_raw.content | b64decode | from_json).state == "done"
          - (delivered_manifest_raw.content | b64decode | from_json).sha256 == delivered_payload_stat.stat.checksum
          - (delivered_manifest_raw.content | b64decode | from_json).filename == "testfile.pdf"

    - name: Verify no partial ".part" bundle directory survives under outgoing/ (B1 atomic publish)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: ".*"
        file_type: directory
        hidden: true
        recurse: false
      register: leftover_part_bundles

    - name: Assert no leftover .part bundle directory
      ansible.builtin.assert:
        that:
          - leftover_part_bundles.matched == 0

    # --- Adapter Instagram (CANARY) ----------------------------------------

    - name: Verify Instagram cookies deployed 0400 root:root (Netscape content)
      ansible.builtin.stat:
        path: /etc/prisme-fetcher/instagram-cookies.txt
      register: instagram_cookies_stat

    - name: Assert Instagram cookies file permissions
      ansible.builtin.assert:
        that:
          - instagram_cookies_stat.stat.exists
          - instagram_cookies_stat.stat.mode == '0400'
          - instagram_cookies_stat.stat.pw_name == 'root'
          - instagram_cookies_stat.stat.gr_name == 'root'

    - name: Verify gallery-dl installed via pipx at the pinned version (1.30.2)
      ansible.builtin.command:
        cmd: /usr/local/bin/gallery-dl --version
      environment:
        PIPX_HOME: /opt/pipx
        PIPX_BIN_DIR: /usr/local/bin
      changed_when: false
      register: gallery_dl_version

    - name: Assert gallery-dl pinned version matches prisme_instagram_gallery_dl_version (exact token, L2)
      vars:
        _installed_version: "{{ (gallery_dl_version.stdout | trim).split(' ') | last }}"
      ansible.builtin.assert:
        that:
          - _installed_version == '1.30.2'

    # M4 (revue 2026-08-03) : le stub gallery-dl deploye plus bas ne valide
    # AUCUN argv reel (il ignore ses arguments hors -D/url). Cette tache
    # verifie donc le VRAI binaire pipx pinne installe par le role — chaque
    # option CLI utilisee par fetch_instagram() (prisme-fetcher.py.j2) doit
    # rester documentee par --help. NOTE explicite : ceci ne couvre PAS les
    # scenarios challenge/carrousel ci-dessous (ces derniers invoquent le
    # stub fixture, jamais ce binaire reel — aucun trafic Instagram reel en
    # molecule, cf commentaire du stub).
    - name: Verify the pinned gallery-dl binary still documents every CLI option the worker invokes (M4 — argv drift guard)
      ansible.builtin.command:
        cmd: /usr/local/bin/gallery-dl --help
      environment:
        PIPX_HOME: /opt/pipx
        PIPX_BIN_DIR: /usr/local/bin
      changed_when: false
      register: gallery_dl_help

    - name: Assert each gallery-dl CLI option used by fetch_instagram() is documented by --help
      # L-A (revue 2026-08-03, cycle 2) : "-D" est le raccourci de
      # "--directory" (pas "--destination", qui n'existe pas dans gallery-dl)
      # — le garde-fou M4 etait donc inoperant sur cette option precise (le
      # membre gauche "-D " suffisait a satisfaire le OR, masquant l'erreur
      # du membre droit).
      ansible.builtin.assert:
        that:
          - "'--config-ignore' in gallery_dl_help.stdout"
          - "'-C ' in gallery_dl_help.stdout or '--cookies' in gallery_dl_help.stdout"
          - "'--range' in gallery_dl_help.stdout"
          - "'--download-archive' in gallery_dl_help.stdout"
          - "'--sleep-request' in gallery_dl_help.stdout"
          - "'--http-timeout' in gallery_dl_help.stdout"
          - "'--write-metadata' in gallery_dl_help.stdout"
          - "'-D ' in gallery_dl_help.stdout or '--directory' in gallery_dl_help.stdout"
        fail_msg: >-
          Le binaire gallery-dl pipx pinne (1.30.2) ne documente plus une
          option argv utilisee par le worker (drift CLI, M4). Rappel : ce
          check ne couvre PAS le stub fixture invoque par les scenarios
          challenge/carrousel ci-dessous.

    - name: Verify unit wires LoadCredential for Instagram cookies (MED — never InaccessiblePaths for this secret)
      ansible.builtin.assert:
        that:
          - "'LoadCredential=instagram-cookies:/etc/prisme-fetcher/instagram-cookies.txt' in (unit_raw.content | b64decode)"

    - name: Deploy a deterministic gallery-dl stub (challenge/carousel/dedup fixtures — zero real Instagram traffic)
      ansible.builtin.copy:
        dest: /usr/local/libexec/prisme-fetcher-gallery-dl-stub
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # Molecule fixture ONLY : simule gallery-dl pour les scenarios
          # deterministes (challenge Instagram + carrousel multi-media +
          # dedup --download-archive) sans jamais emettre de trafic reseau
          # reel vers Instagram (design : aucun contournement de
          # challenge/CAPTCHA n'est simule ici, on simule au contraire
          # l'ARRET propre du worker sur un tel signal).
          #
          # R5 (revue 2026-08-03, cycle 3) : le stub precedent ignorait
          # totalement --download-archive (aucune table sqlite, aucune
          # semantique de skip) — les branches H-B/R1 (dedup cross-job)
          # n'etaient donc JAMAIS exercees en molecule, cause racine
          # documentee de R1 (le bug st_size>0 global n'a jamais ete detecte
          # par le banc molecule). Semantique reprise du banc du reviewer
          # (table sqlite "archive", cle "entry" — cf aussi
          # instagram_archive_row_count/R8 cote worker pour la source
          # officielle gallery-dl sur le format de ce fichier).
          import sqlite3
          import sys
          from pathlib import Path

          args = sys.argv[1:]
          url = args[-1]
          dest = Path(".")
          archive_path = None
          for i, a in enumerate(args):
              if a == "-D" and i + 1 < len(args):
                  dest = Path(args[i + 1])
              if a == "--download-archive" and i + 1 < len(args):
                  archive_path = Path(args[i + 1])

          if "blocked-challenge" in url:
              sys.stderr.write("Instagram responded: checkpoint_required - challenge_required\n")
              sys.exit(1)

          if "carousel" in url:
              for idx in range(1, 4):
                  media = dest / f"carousel_{idx}.jpg"
                  media.write_bytes(f"fixture-media-{idx}".encode())
                  (dest / f"carousel_{idx}.jpg.json").write_text(
                      '{"id": "carousel_%d", "date": "2026-08-03", '
                      '"description": "molecule fixture", '
                      '"username": "operator_test", "shortcode": "carouseltest"}' % idx
                  )
              sys.exit(0)

          # H4 (revue 2026-08-03) fixture : le sidecar declare un username
          # DIFFERENT du handle autorise/declare dans le job — simule un
          # shortcode /p/ appartenant a un tiers (aucun handle derivable de
          # l'URL elle-meme, cf instagram_handle_from_url). Le worker doit
          # rejeter APRES acquisition (H4), rien livre.
          if "impostor-post" in url:
              media = dest / "impostor.jpg"
              media.write_bytes(b"fixture-media-impostor")
              (dest / "impostor.jpg.json").write_text(
                  '{"id": "impostor", "date": "2026-08-03", '
                  '"description": "molecule fixture", '
                  '"username": "someone_else", "shortcode": "impostorpost"}'
              )
              sys.exit(0)

          # R5/M-G (revue 2026-08-03, cycle 3) fixture : sidecar SANS aucune
          # cle username (ni racine, ni owner.username/owner_username) — le
          # worker doit classer ce cas InstagramUsernameUnavailable
          # (retriable, jamais terminal), a distinguer de impostor-post
          # ci-dessus (mismatch confirme, terminal, cf R3).
          if "nouser-post" in url:
              media = dest / "nouser.jpg"
              media.write_bytes(b"fixture-media-nouser")
              (dest / "nouser.jpg.json").write_text(
                  '{"id": "nouser", "date": "2026-08-03", '
                  '"description": "molecule fixture", "shortcode": "nouserpost"}'
              )
              sys.exit(0)

          # R5/R1 fixture : rien produit, AUCUNE entree d'archive prealable
          # pour cette url -> le worker doit rejeter avec
          # instagram_empty_result_no_prior_delivery (state=failed), jamais
          # done (cf discriminant per-job R1).
          if "empty-result" in url:
              sys.exit(0)

          # R5/R1 fixture : semantique --download-archive REELLE (table
          # sqlite "archive", cle "entry" text primary key) pour exercer le
          # dedup cross-job H-B. Job A (1re execution sur cette url) livre 1
          # media et l'enregistre dans SA copie d'archive scopee au job
          # (fusionnee vers l'archive persistante APRES livraison reussie,
          # cf merge_instagram_archive). Job B (MEME url, job_id distinct,
          # execute dans une passe worker ULTERIEURE) retrouve l'entree deja
          # presente dans sa propre copie seedee depuis l'archive
          # persistante -> produit 0 fichier -> le worker doit alors
          # confronter jobs (meme url, etat "done" anterieur, R1) pour poser
          # done+archive_overlap, jamais un signal global.
          if "dedup-post" in url and archive_path is not None:
              conn = sqlite3.connect(archive_path)
              conn.execute("create table if not exists archive (entry text primary key)")
              conn.commit()
              entry = "instagram_dedup-post_1"
              already = conn.execute("select 1 from archive where entry=?", (entry,)).fetchone()
              if already is None:
                  media = dest / "dedup_1.jpg"
                  media.write_bytes(b"fixture-media-dedup")
                  (dest / "dedup_1.jpg.json").write_text(
                      '{"id": "dedup_1", "date": "2026-08-03", '
                      '"description": "molecule fixture", '
                      '"username": "operator_test", "shortcode": "deduppost"}'
                  )
                  conn.execute("insert into archive(entry) values (?)", (entry,))
                  conn.commit()
              conn.close()
              sys.exit(0)

          sys.exit(0)

    - name: Drop an Instagram job whose handle is NOT allowlisted (rejected before any gallery-dl call)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-rejected-handle.json
        content: |
          {"url": "https://www.instagram.com/not_allowed/", "adapter": "instagram", "handle": "not_allowed", "note": "molecule verify: handle not allowlisted"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job whose URL profile handle mismatches the declared job handle (allowlist contournement guard)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-rejected-mismatch.json
        content: |
          {"url": "https://www.instagram.com/someone_else/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: handle mismatch"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job with an invalid (unbounded) --range value
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-rejected-range.json
        content: |
          {"url": "https://www.instagram.com/p/rangebad/", "adapter": "instagram", "handle": "operator_test", "range": "abc", "note": "molecule verify: invalid range"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job whose --range upper bound exceeds prisme_instagram_range_max_upper (H-C)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-rejected-range-too-large.json
        content: |
          {"url": "https://www.instagram.com/p/rangetoolarge/", "adapter": "instagram", "handle": "operator_test", "range": "1-99999", "note": "molecule verify: range upper exceeds hard cap (H-C)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job simulating a challenge/login-required response (blocked, no retry)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-blocked.json
        content: |
          {"url": "https://www.instagram.com/p/blocked-challenge/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: simulated challenge"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job simulating a multi-media carousel post
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-carousel.json
        content: |
          {"url": "https://www.instagram.com/p/carousel-test/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: simulated carousel"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job whose sidecar metadata reveals a THIRD PARTY username (H4 post-acquisition enforcement)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-impostor.json
        content: |
          {"url": "https://www.instagram.com/p/impostor-post/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: sidecar username mismatch (H4)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job targeting stories/<other-handle>/ (H4 — 2nd URL segment must be checked)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-stories-other.json
        content: |
          {"url": "https://www.instagram.com/stories/someone_else/123456789/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: stories 2nd segment mismatch (H4)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    # R5 (revue 2026-08-03, cycle 3) : job A du scenario dedup cross-job
    # (H-B/R1) — 1re livraison sur cette url, amorce l'archive persistante.
    # Traite dans CETTE meme passe (pass 2, avec tous les autres scenarios
    # ci-dessus). Le job B (meme url, job_id distinct) est depose et traite
    # PLUS BAS, dans une passe ULTERIEURE, pour que l'archive persistante
    # soit deja alimentee au moment ou il s'execute.
    - name: Drop Instagram job A for cross-job archive dedup (R5/R1 — first delivery, primes the persistent archive)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-dedup-a.json
        content: |
          {"url": "https://www.instagram.com/p/dedup-post/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: dedup job A (primes archive, R5/R1)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job whose sidecar carries NO username at all (R5/M-G — retriable, never terminal)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-nouser.json
        content: |
          {"url": "https://www.instagram.com/p/nouser-post/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: sidecar has no username field (R5/M-G)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop an Instagram job that yields a genuinely empty result with NO prior delivery (R5/R1 — must fail, never done)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-empty-result.json
        content: |
          {"url": "https://www.instagram.com/p/empty-result/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: empty result, no archive overlap (R5/R1)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Run a second worker pass to process the Instagram adapter fixtures
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
      become: true
      become_user: prisme-fetcher
      changed_when: false

    - name: Find archived manifests for Instagram-adapter jobs (rejected + blocked)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/rejects
        patterns: "manifest.json"
        recurse: true
      register: instagram_manifests

    # C1 (revue 2026-08-03) : map('lookup', 'ansible.builtin.file') n'existe
    # pas comme filtre Jinja (lookup est une fonction globale, pas un filtre
    # — et l'ordre des arguments serait de toute facon inverse). Cette tache
    # partait en erreur de templating : les 5 assertions ci-dessous n'ont
    # JAMAIS tourne vertes. Fix : ansible.builtin.slurp (execute sur la
    # cible, jamais le controller) en boucle, contenu agrege puis
    # assertion `is search(...)`.
    - name: Slurp all archived Instagram-adapter manifests from the TARGET host (C1 fix)
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ instagram_manifests.files }}"
      register: instagram_manifests_slurped

    - name: Assert all 8 non-carousel/non-dedup Instagram scenarios archived a manifest with the expected reason
      vars:
        _instagram_joined: "{{ instagram_manifests_slurped.results | map(attribute='content') | map('b64decode') | join('\n') }}"
      ansible.builtin.assert:
        that:
          # 7 depuis cycle 1/2 (handle/mismatch/invalid_range/blocked/
          # username_not_allowlisted/range_upper_too_large) + 2 nouvelles
          # (R5/cycle 3 : username_absent + instagram_empty_result_no_prior_delivery).
          # dedup-a (job A du scenario R1) est un SUCCES (done) et n'est
          # JAMAIS snapshotte sous rejects/ (M-B) — n'entre pas dans ce compte.
          - instagram_manifests.matched >= 9
          - _instagram_joined is search('handle_not_allowlisted')
          - _instagram_joined is search('handle_mismatch')
          - _instagram_joined is search('invalid_range')
          - >-
            _instagram_joined is search('"state": "blocked"')
          - _instagram_joined is search('blocked:challenge_required')
          # H4 (revue 2026-08-03) : le tiers /p/impostor-post/ est rejete
          # APRES acquisition (sidecar username != handle autorise), rien
          # livre.
          - _instagram_joined is search('username_not_allowlisted')
          # H-C (revue 2026-08-03, cycle 2) : range "1-99999" rejete AVANT
          # tout appel gallery-dl (jamais une deadline demesuree).
          - _instagram_joined is search('range_upper_too_large')
          # R5/M-G (revue 2026-08-03, cycle 3) : sidecar sans username ->
          # retriable (InstagramUsernameUnavailable), jamais terminal
          # directement — distinct de username_not_allowlisted ci-dessus (R3).
          - _instagram_joined is search('username_absent')
          # R5/R1 (revue 2026-08-03, cycle 3) : resultat vide SANS livraison
          # anterieure sur cette url -> echec REEL, jamais un faux `done`
          # global (cause racine R1).
          - _instagram_joined is search('instagram_empty_result_no_prior_delivery')

    - name: Find the delivered Instagram carousel bundle (multi-media — B1 atomic publish)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: "carousel_*.jpg"
        recurse: true
      register: carousel_media

    - name: Assert the full carousel (3 media) was delivered as ONE bundle, sidecars excluded
      ansible.builtin.assert:
        that:
          - carousel_media.matched == 3
          - (carousel_media.files | map(attribute='path') | map('dirname') | unique | length) == 1

    - name: Read the carousel bundle manifest
      ansible.builtin.slurp:
        src: "{{ (carousel_media.files[0].path | dirname) }}/manifest.json"
      register: carousel_manifest_raw

    - name: Assert the manifest lists all 3 files with metadata, and no raw *.json sidecar leaked into the bundle
      vars:
        _carousel_manifest: "{{ carousel_manifest_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - _carousel_manifest.state == "done"
          - _carousel_manifest.files | length == 3
          - _carousel_manifest.files | selectattr('metadata.username', 'equalto', 'operator_test') | list | length == 3
          # M8 (revue 2026-08-03) : verifie APRES l'enforcement H4 (tous les
          # usernames sidecar == handle autorise) -> allowlist_scope passe de
          # "input_url_only" a "verified_username".
          - _carousel_manifest.allowlist_scope == "verified_username"
          # H6 (revue 2026-08-03) : range_default molecule = "1-5" (converge.yml),
          # 3 medias livres < borne haute 5 -> partial=true. C'est un
          # HEURISTIQUE CONSERVATEUR documente (delivered < range_upper), PAS
          # une preuve de perte : un compte reel ayant moins de posts que la
          # borne haute demandee produira toujours partial=true. Ne JAMAIS
          # lire "bundle complet" depuis ce champ (CANARY-5 gate wording).
          - _carousel_manifest.partial == true
          - _carousel_manifest.range_upper == 5
          - _carousel_manifest.delivered_count == 3
          # M-A (revue 2026-08-03, cycle 2) : partial est desormais calcule
          # sur le SPAN (upper-lower+1), pas seulement upper — range_lower est
          # expose pour rendre ce calcul auditable depuis le manifeste, et
          # partial_reason distingue explicitement ce cas ("compte a moins de
          # posts que demande") du cas H-B (dedup cross-job, "archive_overlap").
          - _carousel_manifest.range_lower == 1
          - _carousel_manifest.partial_reason == "fewer_items_than_requested"

    - name: Find any leftover metadata sidecar in the delivered carousel bundle (must be zero — enriched into manifest, never shipped raw)
      ansible.builtin.find:
        paths: "{{ (carousel_media.files[0].path | dirname) }}"
        patterns: "*.jpg.json"
      register: carousel_sidecars

    - name: Assert no raw sidecar survives delivery
      ansible.builtin.assert:
        that:
          - carousel_sidecars.matched == 0

    - name: Verify no residual work/ directory survives the Instagram adapter pass either (A3)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/work
        file_type: directory
        recurse: false
      register: instagram_leftover_workdirs

    - name: Assert no workdir leak survives the Instagram adapter pass
      ansible.builtin.assert:
        that:
          - instagram_leftover_workdirs.matched == 0

    - name: Find the delivered Instagram dedup bundle (job A only, from the pass above)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: "dedup_1.jpg"
        recurse: true
      register: dedup_bundle_media

    - name: Assert job A delivered the dedup bundle exactly once (baseline before job B)
      ansible.builtin.assert:
        that:
          - dedup_bundle_media.matched == 1

    # R5/R1 (revue 2026-08-03, cycle 3) : job B est depose et traite dans une
    # passe SEPAREE, APRES que job A ait deja atteint l'etat "done" — c'est
    # precisement la condition que le discriminant R1 (jobs, meme url, etat
    # "done" anterieur) doit reconnaitre. MEME url que job A, job_id distinct
    # (contenu du fichier different, cf note) pour ne pas etre GC'd comme un
    # doublon avant traitement.
    - name: Drop Instagram job B for cross-job archive dedup (R5/R1 — same url, distinct job_id, archive already primed by job A)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-dedup-b.json
        content: |
          {"url": "https://www.instagram.com/p/dedup-post/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: dedup job B (archive already primed by job A, R5/R1)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Run an intermediate worker pass to process Instagram dedup job B (R5/R1)
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
      become: true
      become_user: prisme-fetcher
      changed_when: false

    - name: Find the delivered Instagram dedup bundle again (job B must NOT duplicate job A's delivery)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: "dedup_1.jpg"
        recurse: true
      register: dedup_bundle_media_after_b

    - name: Assert job B did not deliver a second copy (dedup correctness)
      ansible.builtin.assert:
        that:
          - dedup_bundle_media_after_b.matched == 1

    - name: Find ALL per-job manifests (manifests/ — M7 traceability, includes successes, unlike rejects/)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/manifests
        patterns: "*.json"
      register: instagram_all_manifests

    - name: Slurp all per-job manifests from the TARGET host (R5/R1)
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ instagram_all_manifests.files }}"
      register: instagram_all_manifests_slurped

    - name: Assert Instagram dedup job B was marked done+archive_overlap (R1 — job-scoped proof via jobs, never a global signal)
      vars:
        _all_manifests_joined: "{{ instagram_all_manifests_slurped.results | map(attribute='content') | map('b64decode') | join('\n') }}"
      ansible.builtin.assert:
        that:
          # L5 : contrat H-B fige — le manifeste de job B porte
          # skipped_already_acquired/partial/partial_reason, JAMAIS
          # files/delivered_count (aucun media n'a ete acquis par CE job).
          - >-
            _all_manifests_joined is search('"skipped_already_acquired": true')
          - >-
            _all_manifests_joined is search('"partial_reason": "archive_overlap"')

    - name: Run a THIRD worker pass — the blocked job must NOT retry (terminal state, GC'd)
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
      become: true
      become_user: prisme-fetcher
      changed_when: false

    # R5/M-G (revue 2026-08-03, cycle 3) : "nouser" reste volontairement
    # EXCLU — son etat est retry_wait (1 tentative < MAX_ATTEMPTS), pas un
    # etat terminal (done/rejected/failed/blocked) : scan_jobs() ne GC que les
    # etats terminaux (cf commentaire GC dans le worker), retry_wait est donc
    # cense survivre jusqu'a l'epuisement des tentatives ou une reprise
    # operateur legitime. L'inclure ici casserait la distinction
    # retriable/terminal que ce meme scenario est cense demontrer.
    - name: Verify the blocked/rejected/carousel/dedup job files were garbage-collected (terminal states, never re-processed)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/jobs
        patterns: "molecule-instagram-*.json"
        excludes: "molecule-instagram-nouser.json"
      register: instagram_jobs_leftover

    - name: Assert zero terminal-state Instagram job files remain (no retry loop on terminal states, incl. blocked)
      ansible.builtin.assert:
        that:
          - instagram_jobs_leftover.matched == 0

    - name: Verify the retriable nouser job file still exists (R5/M-G — retry_wait is not GC'd, unlike a terminal state)
      ansible.builtin.stat:
        path: /var/lib/prisme-fetcher/jobs/molecule-instagram-nouser.json
      register: nouser_job_leftover

    - name: Assert the nouser job stayed in DB-tracked retry_wait (never silently dropped, never terminal)
      ansible.builtin.assert:
        that:
          - nouser_job_leftover.stat.exists
