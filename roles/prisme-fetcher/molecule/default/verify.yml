---
- name: Verify Prisme fetcher
  hosts: all
  become: true
  tasks:
    - name: Inspect installed fetcher
      ansible.builtin.stat:
        path: /usr/local/libexec/prisme-fetcher
      register: fetcher

    - name: Verify executable and state directory
      ansible.builtin.assert:
        that:
          - fetcher.stat.executable
          - fetcher.stat.pw_name == 'root'

    - name: Read rendered unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/prisme-fetcher.service
      register: unit_raw

    - name: Verify unit opens AF_INET/AF_INET6, wires the environment file, and bounds resources (A2/A5/B5)
      ansible.builtin.assert:
        that:
          - "'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6' in (unit_raw.content | b64decode)"
          - "'EnvironmentFile=/etc/prisme-fetcher/env' in (unit_raw.content | b64decode)"
          - "'MemoryMax=1G' in (unit_raw.content | b64decode)"
          - "'TasksMax=64' in (unit_raw.content | b64decode)"
          - "'IPAddressDeny=' in (unit_raw.content | b64decode)"
          - "'InaccessiblePaths=' in (unit_raw.content | b64decode)"

    - name: Inspect environment file permissions
      ansible.builtin.stat:
        path: /etc/prisme-fetcher/env
      register: env_file

    - name: Verify environment file is 0600 root:root
      ansible.builtin.assert:
        that:
          - env_file.stat.exists
          - env_file.stat.mode == '0600'
          - env_file.stat.pw_name == 'root'
          - env_file.stat.gr_name == 'root'

    - name: Verify worker template compiles (python3 -m py_compile)
      ansible.builtin.command:
        cmd: python3 -m py_compile /usr/local/libexec/prisme-fetcher
      changed_when: false

    - name: Verify transfer script compiles under bash -n
      ansible.builtin.command:
        cmd: bash -n /usr/local/libexec/prisme-fetcher-transfer
      changed_when: false

    - name: Create fixture directory for the loopback HTTP test server (A9)
      ansible.builtin.file:
        path: /tmp/prisme-verify-http
        state: directory
        mode: "0755"

    - name: Write a known-content test payload
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-http/testfile.pdf
        content: "prisme-fetcher molecule verify fixture — A9 success scenario\n"
        mode: "0644"

    - name: Write a minimal HTTP redirect server (redirects OUTSIDE the allowlist)
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-http/redirect_server.py
        mode: "0644"
        content: |
          import http.server


          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(302)
                  self.send_header("Location", "http://example.invalid/blocked")
                  self.end_headers()

              def log_message(self, *args):
                  pass


          http.server.HTTPServer(("127.0.0.1", 8074), Handler).serve_forever()

    - name: Start the loopback HTTP test server as a transient systemd unit
      ansible.builtin.command:
        cmd: >-
          systemd-run --unit=prisme-verify-http --collect
          python3 -m http.server 8073 --directory /tmp/prisme-verify-http --bind 127.0.0.1
      changed_when: true

    - name: Start the redirect test server as a transient systemd unit
      ansible.builtin.command:
        cmd: systemd-run --unit=prisme-verify-redirect --collect python3 /tmp/prisme-verify-http/redirect_server.py
      changed_when: true

    - name: Wait for the loopback test servers to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 5
      loop:
        - 8073
        - 8074

    - name: Drop a fixture http job outside the allowlist (rejected before download)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-rejected.json
        content: |
          {"url": "https://example.invalid/some/asset.pdf", "adapter": "http", "note": "molecule verify: outside allowlist"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop a fixture http job INSIDE the allowlist against the loopback server (A9 success)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-accepted.json
        content: |
          {"url": "http://127.0.0.1:8073/testfile.pdf", "adapter": "http", "note": "molecule verify: success path"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Drop a fixture http job whose allowlisted URL redirects OUTSIDE the allowlist (A9 redirect rejection)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-redirect-rejected.json
        content: |
          {"url": "http://127.0.0.1:8074/", "adapter": "http", "note": "molecule verify: redirect leaves allowlist"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    # C1-bis (revue 2026-08-03, cycle 2) : $CREDENTIALS_DIRECTORY n'existe QUE
    # sous systemd (LoadCredential=) — un `ansible.builtin.command` direct
    # (comme les 3 taches --once ci-dessous) ne le peuple jamais, donc
    # instagram_cookies_path() levait systematiquement
    # instagram_cookies_unavailable pour TOUT job Instagram, quel que soit le
    # scenario (blocked/carousel/impostor n'ont jamais pu passer). Fixture :
    # meme layout que LoadCredential (fichier prive, nom == credential_name),
    # deposee UNE FOIS ici et reutilisee par les 3 taches --once via
    # `environment:`. Le fichier source (/etc/prisme-fetcher/instagram-cookies.txt)
    # est deja deploye par le role au converge (prisme_instagram_enabled: true).
    - name: Create CREDENTIALS_DIRECTORY fixture for --once oneshot runs (C1-bis)
      ansible.builtin.file:
        path: /tmp/prisme-verify-creds
        state: directory
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0700"

    - name: Deploy the Instagram cookies credential into the fixture CREDENTIALS_DIRECTORY (mirrors systemd LoadCredential's runtime layout)
      ansible.builtin.copy:
        src: /etc/prisme-fetcher/instagram-cookies.txt
        dest: /tmp/prisme-verify-creds/instagram-cookies
        remote_src: true
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0400"

    - name: Run one worker pass in oneshot mode
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
        # CANARY-1b : le worker consomme desormais PRISME_FETCHER_TOKEN
        # au runtime (os.environ) pour authentifier authorization/heartbeat
        # aupres du stub control-plane -- ce fichier invoque le binaire hors
        # systemd (EnvironmentFile= n'est jamais source ici), donc le jeton
        # doit etre passe explicitement, meme valeur que
        # vault_prisme_fetcher_token (converge.yml).
        PRISME_FETCHER_TOKEN: molecule-fetcher-token-32-characters
      become: true
      become_user: prisme-fetcher
      changed_when: false

    - name: Find the archived manifest for jobs rejected before/around download (A3 — no longer staged in work/)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/rejects
        patterns: "manifest.json"
        recurse: true
      register: rejected_manifests

    - name: Verify the fetcher's work/ directory holds no residual job workdir after a completed pass (A3)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/work
        file_type: directory
        recurse: false
      register: leftover_workdirs

    - name: Verify no workdir leak survives a completed scan (A3)
      ansible.builtin.assert:
        that:
          - leftover_workdirs.matched == 0

    # C1 (revue 2026-08-03) : lookup('ansible.builtin.file', ...) lit le
    # filesystem du CONTROLLER (waza), pas celui de la cible molecule (driver
    # docker, cf molecule.yml) — ces assertions lisaient des chemins
    # inexistants cote controller et n'ont jamais vraiment verifie le contenu
    # cible. Fix : ansible.builtin.slurp (execute sur la cible) en boucle,
    # contenu agrege puis assertion `is search(...)`.
    - name: Slurp both rejected manifests from the TARGET host (C1 fix)
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ rejected_manifests.files }}"
      register: rejected_manifests_slurped

    - name: Verify BOTH rejected jobs (domain-not-allowlisted + redirect-left-allowlist) archived a v2 manifest
      vars:
        _rejected_joined: "{{ rejected_manifests_slurped.results | map(attribute='content') | map('b64decode') | join('\n') }}"
      ansible.builtin.assert:
        that:
          - rejected_manifests.matched == 2
          - >-
            _rejected_joined is search('"schema": "prisme.source-bundle.v2"')
          - >-
            _rejected_joined is search('"state": "rejected"')

    - name: Verify one rejection reason is domain_not_allowlisted and the other redirect_left_allowlist
      vars:
        _rejected_joined: "{{ rejected_manifests_slurped.results | map(attribute='content') | map('b64decode') | join('\n') }}"
      ansible.builtin.assert:
        that:
          - _rejected_joined is search('domain_not_allowlisted')
          - _rejected_joined is search('redirect_left_allowlist')

    - name: Find the delivered bundle for the accepted job (A9 success — A1 regression guard)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: "testfile.pdf"
        recurse: true
      register: delivered_payload

    - name: Verify exactly one real media payload was delivered (never manifest.json mistaken for the media, cf A1)
      ansible.builtin.assert:
        that:
          - delivered_payload.matched == 1

    - name: Read the delivered bundle's manifest
      ansible.builtin.slurp:
        src: "{{ (delivered_payload.files[0].path | dirname) }}/manifest.json"
      register: delivered_manifest_raw

    - name: Compute the sha256 of the delivered media payload
      ansible.builtin.stat:
        path: "{{ delivered_payload.files[0].path }}"
        checksum_algorithm: sha256
      register: delivered_payload_stat

    - name: Verify the manifest's sha256 matches the actual delivered media (A1 regression guard — this is the check the manifest/media swap bug would have failed)
      ansible.builtin.assert:
        that:
          - (delivered_manifest_raw.content | b64decode | from_json).state == "done"
          - (delivered_manifest_raw.content | b64decode | from_json).sha256 == delivered_payload_stat.stat.checksum
          - (delivered_manifest_raw.content | b64decode | from_json).filename == "testfile.pdf"

    - name: Verify no partial ".part" bundle directory survives under outgoing/ (B1 atomic publish)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: ".*"
        file_type: directory
        hidden: true
        recurse: false
      register: leftover_part_bundles

    - name: Assert no leftover .part bundle directory
      ansible.builtin.assert:
        that:
          - leftover_part_bundles.matched == 0

    # --- Adapter Instagram (CANARY) ----------------------------------------

    - name: Verify Instagram cookies deployed 0400 root:root (Netscape content)
      ansible.builtin.stat:
        path: /etc/prisme-fetcher/instagram-cookies.txt
      register: instagram_cookies_stat

    - name: Assert Instagram cookies file permissions
      ansible.builtin.assert:
        that:
          - instagram_cookies_stat.stat.exists
          - instagram_cookies_stat.stat.mode == '0400'
          - instagram_cookies_stat.stat.pw_name == 'root'
          - instagram_cookies_stat.stat.gr_name == 'root'

    - name: Verify gallery-dl installed via pipx at the pinned version (1.30.2)
      ansible.builtin.command:
        cmd: /usr/local/bin/gallery-dl --version
      environment:
        PIPX_HOME: /opt/pipx
        PIPX_BIN_DIR: /usr/local/bin
      changed_when: false
      register: gallery_dl_version

    - name: Assert gallery-dl pinned version matches prisme_instagram_gallery_dl_version (exact token, L2)
      vars:
        _installed_version: "{{ (gallery_dl_version.stdout | trim).split(' ') | last }}"
      ansible.builtin.assert:
        that:
          - _installed_version == '1.30.2'

    # M4 (revue 2026-08-03) : le stub gallery-dl deploye plus bas ne valide
    # AUCUN argv reel (il ignore ses arguments hors -D/url). Cette tache
    # verifie donc le VRAI binaire pipx pinne installe par le role — chaque
    # option CLI utilisee par fetch_instagram() (prisme-fetcher.py.j2) doit
    # rester documentee par --help. NOTE explicite : ceci ne couvre PAS les
    # scenarios challenge/carrousel ci-dessous (ces derniers invoquent le
    # stub fixture, jamais ce binaire reel — aucun trafic Instagram reel en
    # molecule, cf commentaire du stub).
    - name: Verify the pinned gallery-dl binary still documents every CLI option the worker invokes (M4 — argv drift guard)
      ansible.builtin.command:
        cmd: /usr/local/bin/gallery-dl --help
      environment:
        PIPX_HOME: /opt/pipx
        PIPX_BIN_DIR: /usr/local/bin
      changed_when: false
      register: gallery_dl_help

    - name: Assert each gallery-dl CLI option used by fetch_instagram() is documented by --help
      # L-A (revue 2026-08-03, cycle 2) : "-D" est le raccourci de
      # "--directory" (pas "--destination", qui n'existe pas dans gallery-dl)
      # — le garde-fou M4 etait donc inoperant sur cette option precise (le
      # membre gauche "-D " suffisait a satisfaire le OR, masquant l'erreur
      # du membre droit).
      ansible.builtin.assert:
        that:
          - "'--config-ignore' in gallery_dl_help.stdout"
          - "'-C ' in gallery_dl_help.stdout or '--cookies' in gallery_dl_help.stdout"
          - "'--range' in gallery_dl_help.stdout"
          - "'--download-archive' in gallery_dl_help.stdout"
          - "'--sleep-request' in gallery_dl_help.stdout"
          - "'--http-timeout' in gallery_dl_help.stdout"
          - "'--write-metadata' in gallery_dl_help.stdout"
          - "'-D ' in gallery_dl_help.stdout or '--directory' in gallery_dl_help.stdout"
        fail_msg: >-
          Le binaire gallery-dl pipx pinne (1.30.2) ne documente plus une
          option argv utilisee par le worker (drift CLI, M4). Rappel : ce
          check ne couvre PAS le stub fixture invoque par les scenarios
          challenge/carrousel ci-dessous.

    - name: Verify unit wires LoadCredential for Instagram cookies (MED — never InaccessiblePaths for this secret)
      ansible.builtin.assert:
        that:
          - "'LoadCredential=instagram-cookies:/etc/prisme-fetcher/instagram-cookies.txt' in (unit_raw.content | b64decode)"

    - name: Deploy a deterministic gallery-dl stub (challenge/carousel/dedup fixtures — zero real Instagram traffic)
      ansible.builtin.copy:
        dest: /usr/local/libexec/prisme-fetcher-gallery-dl-stub
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # Molecule fixture ONLY : simule gallery-dl pour les scenarios
          # deterministes (challenge Instagram + carrousel multi-media +
          # dedup --download-archive) sans jamais emettre de trafic reseau
          # reel vers Instagram (design : aucun contournement de
          # challenge/CAPTCHA n'est simule ici, on simule au contraire
          # l'ARRET propre du worker sur un tel signal).
          #
          # R5 (revue 2026-08-03, cycle 3) : le stub precedent ignorait
          # totalement --download-archive (aucune table sqlite, aucune
          # semantique de skip) — les branches H-B/R1 (dedup cross-job)
          # n'etaient donc JAMAIS exercees en molecule, cause racine
          # documentee de R1 (le bug st_size>0 global n'a jamais ete detecte
          # par le banc molecule). Semantique reprise du banc du reviewer
          # (table sqlite "archive", cle "entry" — cf aussi
          # instagram_archive_row_count/R8 cote worker pour la source
          # officielle gallery-dl sur le format de ce fichier).
          import sqlite3
          import sys
          from pathlib import Path

          args = sys.argv[1:]
          url = args[-1]
          dest = Path(".")
          archive_path = None
          for i, a in enumerate(args):
              if a == "-D" and i + 1 < len(args):
                  dest = Path(args[i + 1])
              if a == "--download-archive" and i + 1 < len(args):
                  archive_path = Path(args[i + 1])

          if "blocked-challenge" in url:
              sys.stderr.write("Instagram responded: checkpoint_required - challenge_required\n")
              sys.exit(1)

          if "carousel" in url:
              for idx in range(1, 4):
                  media = dest / f"carousel_{idx}.jpg"
                  media.write_bytes(f"fixture-media-{idx}".encode())
                  (dest / f"carousel_{idx}.jpg.json").write_text(
                      '{"id": "carousel_%d", "date": "2026-08-03", '
                      '"description": "molecule fixture", '
                      '"username": "operator_test", "shortcode": "carouseltest"}' % idx
                  )
              sys.exit(0)

          # H4 (revue 2026-08-03) fixture : le sidecar declare un username
          # DIFFERENT du handle autorise/declare dans le job — simule un
          # shortcode /p/ appartenant a un tiers (aucun handle derivable de
          # l'URL elle-meme, cf instagram_handle_from_url). Le worker doit
          # rejeter APRES acquisition (H4), rien livre.
          if "impostor-post" in url:
              media = dest / "impostor.jpg"
              media.write_bytes(b"fixture-media-impostor")
              (dest / "impostor.jpg.json").write_text(
                  '{"id": "impostor", "date": "2026-08-03", '
                  '"description": "molecule fixture", '
                  '"username": "someone_else", "shortcode": "impostorpost"}'
              )
              sys.exit(0)

          # R5/M-G (revue 2026-08-03, cycle 3) fixture : sidecar SANS aucune
          # cle username (ni racine, ni owner.username/owner_username) — le
          # worker doit classer ce cas InstagramUsernameUnavailable
          # (retriable, jamais terminal), a distinguer de impostor-post
          # ci-dessus (mismatch confirme, terminal, cf R3).
          if "nouser-post" in url:
              media = dest / "nouser.jpg"
              media.write_bytes(b"fixture-media-nouser")
              (dest / "nouser.jpg.json").write_text(
                  '{"id": "nouser", "date": "2026-08-03", '
                  '"description": "molecule fixture", "shortcode": "nouserpost"}'
              )
              sys.exit(0)

          # R5/R1 fixture : rien produit, AUCUNE entree d'archive prealable
          # pour cette url -> le worker doit rejeter avec
          # instagram_empty_result_no_prior_delivery (state=failed), jamais
          # done (cf discriminant per-job R1).
          if "empty-result" in url:
              sys.exit(0)

          # R5/R1 fixture : semantique --download-archive REELLE (table
          # sqlite "archive", cle "entry" text primary key) pour exercer le
          # dedup cross-job H-B. Job A (1re execution sur cette url) livre 1
          # media et l'enregistre dans SA copie d'archive scopee au job
          # (fusionnee vers l'archive persistante APRES livraison reussie,
          # cf merge_instagram_archive). Job B (MEME url, job_id distinct,
          # execute dans une passe worker ULTERIEURE) retrouve l'entree deja
          # presente dans sa propre copie seedee depuis l'archive
          # persistante -> produit 0 fichier -> le worker doit alors
          # confronter jobs (meme url, etat "done" anterieur, R1) pour poser
          # done+archive_overlap, jamais un signal global.
          if "dedup-post" in url and archive_path is not None:
              conn = sqlite3.connect(archive_path)
              conn.execute("create table if not exists archive (entry text primary key)")
              conn.commit()
              entry = "instagram_dedup-post_1"
              already = conn.execute("select 1 from archive where entry=?", (entry,)).fetchone()
              if already is None:
                  media = dest / "dedup_1.jpg"
                  media.write_bytes(b"fixture-media-dedup")
                  (dest / "dedup_1.jpg.json").write_text(
                      '{"id": "dedup_1", "date": "2026-08-03", '
                      '"description": "molecule fixture", '
                      '"username": "operator_test", "shortcode": "deduppost"}'
                  )
                  conn.execute("insert into archive(entry) values (?)", (entry,))
                  conn.commit()
              conn.close()
              sys.exit(0)

          sys.exit(0)

    # --- Contrat fetcher <-> control-plane Prisme (CANARY-1b) --------------
    # Demarre AVANT toute passe qui touche l'adapter Instagram (ci-dessous) :
    # depuis ce chantier, CHAQUE job Instagram passe par la garde
    # d'autorisation avant process_instagram_job -- sans ce stub up (mode
    # "true" par defaut), TOUS les scenarios pre-existants (handle/mismatch/
    # blocked/carousel/etc.) echoueraient desormais sur
    # InstagramAuthorizationCheckFailed au lieu d'exercer leur propre logique
    # de rejet. Le mode est relu depuis un fichier mutable (pas fige a l'env
    # du process) pour que les scenarios authorized:false/unreachable
    # ci-dessous (fin de fichier) puissent faire basculer le verdict SANS
    # redemarrer ce serveur transitoire.
    - name: Write the fetcher control-plane mode file (default authorized)
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-authz-mode
        content: "true"
        mode: "0644"

    - name: Write a minimal fetcher control-plane stub (authorization + heartbeat routes, CANARY-1b)
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-http/authz_server.py
        mode: "0644"
        content: |
          import http.server
          import json
          from pathlib import Path

          TOKEN = "molecule-fetcher-token-32-characters"
          MODE_FILE = Path("/tmp/prisme-verify-authz-mode")
          # M2 (revue 2026-08-03, cycle 4) : journalise CHAQUE requete recue
          # (jsonl, une ligne par requete) -- le stub precedent etait muet,
          # aucune assertion ne pouvait prouver que le worker appelle
          # reellement authorization/heartbeat avec le bon contrat.
          LOG_FILE = Path("/tmp/prisme-verify-http/authz_requests.jsonl")


          class Handler(http.server.BaseHTTPRequestHandler):
              def _check_auth(self):
                  return self.headers.get("Authorization") == f"Bearer {TOKEN}"

              def _log(self, record):
                  with LOG_FILE.open("a") as handle:
                      handle.write(json.dumps(record) + "\n")

              def do_GET(self):
                  if not self.path.startswith("/api/v1/connectors/instagram/authorization"):
                      self.send_response(404)
                      self.end_headers()
                      return
                  if not self._check_auth():
                      self._log({"method": "GET", "path": self.path, "authorized_header": False})
                      self.send_response(401)
                      self.end_headers()
                      return
                  mode = MODE_FILE.read_text().strip() if MODE_FILE.exists() else "true"
                  # C1 (revue 2026-08-03, cycle 4) : mode "404" simule un
                  # connecteur pas encore provisionne cote prisme
                  # (dispatcher.ts) -- verdict REEL, jamais une panne.
                  if mode == "404":
                      self._log({"method": "GET", "path": self.path, "mode": mode})
                      self.send_response(404)
                      self.end_headers()
                      return
                  self._log({"method": "GET", "path": self.path, "mode": mode})
                  # LOW (revue GO cycle 2) : mode "heartbeat_404" isole le
                  # scenario 404 au SEUL POST /heartbeat (cf do_POST) --
                  # l'authorization GET reste "true"/active pour ne pas
                  # conflater les deux contrats testes independamment.
                  authorized = mode in ("true", "heartbeat_404")
                  body = json.dumps(
                      {"authorized": authorized, "state": "active" if authorized else "revoked"}
                  ).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_POST(self):
                  if self.path != "/api/v1/connectors/instagram/heartbeat":
                      self.send_response(404)
                      self.end_headers()
                      return
                  if not self._check_auth():
                      self._log({"method": "POST", "path": self.path, "authorized_header": False})
                      self.send_response(401)
                      self.end_headers()
                      return
                  # LOW (revue GO cycle 2) : mode "heartbeat_404" simule un
                  # connecteur non provisionne cote heartbeat (meme doctrine
                  # C1 que l'authorization GET) -- prouve que le worker route
                  # ce 404 vers instagram_heartbeat_not_provisioned, jamais
                  # instagram_heartbeat_failed generique.
                  mode = MODE_FILE.read_text().strip() if MODE_FILE.exists() else "true"
                  if mode == "heartbeat_404":
                      self._log({"method": "POST", "path": self.path, "mode": mode})
                      self.send_response(404)
                      self.end_headers()
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  raw = self.rfile.read(length)
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      payload = {}
                  self._log({"method": "POST", "path": self.path, "payload": payload})
                  # M2 (revue 2026-08-03, cycle 4) : validation alignee sur
                  # dispatcher.ts -- status doit etre ready|degraded|down,
                  # adapterVersion non vide, sinon 422 (jamais un 202
                  # permissif qui masquerait une regression de payload cote
                  # worker).
                  status = payload.get("status")
                  adapter_version = payload.get("adapterVersion")
                  if status not in ("ready", "degraded", "down") or not adapter_version:
                      self.send_response(422)
                      self.end_headers()
                      return
                  body = json.dumps({"accepted": True}).encode()
                  self.send_response(202)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass


          http.server.HTTPServer(("127.0.0.1", 8090), Handler).serve_forever()

    - name: Start the fetcher control-plane stub as a transient systemd unit
      ansible.builtin.command:
        cmd: systemd-run --unit=prisme-verify-authz --collect python3 /tmp/prisme-verify-http/authz_server.py
