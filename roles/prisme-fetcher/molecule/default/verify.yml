    - name: Verify no residual work/ directory survives the Instagram adapter pass either (A3)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/work
        file_type: directory
        recurse: false
      register: instagram_leftover_workdirs

    - name: Assert no workdir leak survives the Instagram adapter pass
      ansible.builtin.assert:
        that:
          - instagram_leftover_workdirs.matched == 0

    - name: Find the delivered Instagram dedup bundle (job A only, from the pass above)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/outgoing
        patterns: "dedup_1.jpg"
        recurse: true
      register: dedup_bundle_media

    - name: Assert job A delivered the dedup bundle exactly once (baseline before job B)
      ansible.builtin.assert:
        that:
          - dedup_bundle_media.matched == 1

    # R5/R1 (revue 2026-08-03, cycle 3) : job B est depose et traite dans une
    # passe SEPAREE, APRES que job A ait deja atteint l'etat "done" — c'est
