---
prisme_enabled: false
prisme_deploy_enabled: false
# Allows the tested web/API + migrations to be installed before P5-P9 workers exist.
# This is an explicit degraded deployment, never a substitute for closing G4-G9.
prisme_workers_enabled: true
prisme_config_dir: "/opt/{{ project_name }}/configs/prisme"
prisme_data_dir: "/opt/{{ project_name }}/data/prisme"
prisme_backup_dir: "/opt/{{ project_name }}/backups/prisme"
prisme_model_dir: "/opt/{{ project_name }}/data/prisme/models"

prisme_registry_server: "git.ewutelo.cloud"
prisme_registry_user: "mobuone"
prisme_image_repository: "git.ewutelo.cloud/mobuone/prisme"
prisme_image_digest: ""
prisme_db_proxy_image: ""
prisme_internal_subnet: "172.30.10.0/24"
prisme_db_proxy_internal_ip: "172.30.10.10"
prisme_database_name: "prisme"
prisme_database_user: "prisme"
prisme_karakeep_enabled: false
prisme_karakeep_base_url: "http://karakeep:3000"
prisme_litellm_key: "sk-prisme-{{ vault_prisme_fetcher_token | hash('sha256') }}"
# Indirection rôle-locale sur la clé Qdrant partagée (pattern llamaindex-memory-worker).
prisme_qdrant_api_key: "{{ qdrant_api_key }}"
# Fusion du retrieval hybride (rrf|dbsf) — une seule source, consommée par l'app.
prisme_fusion_mode: "rrf"
# Endpoint dense (banga knowledge-embedding :18082). Vide = mode dégradé bm25-only
# tant que le gate G-réseau Sese→banga n'est pas ouvert.
prisme_dense_embedding_url: ""
prisme_litellm_daily_budget: 0.50
# Modèle de synthèse /ask via LiteLLM (doit exister dans roles/litellm model_name).
prisme_ask_model: "claude-haiku"
prisme_sparse_model: "Qdrant/bm25"
prisme_sparse_revision: "e499a1f8d6bec960aab5533a0941bf914e70faf9"
prisme_sparse_model_config: >-
  {{ prisme_model_dir }}/models--Qdrant--bm25/snapshots/{{ prisme_sparse_revision }}/config.json

# CANARY-1b/CANARY-2 (gate 5 du bouton d'activation Instagram) : fail-closed
# par defaut — jamais true tant que le deploiement reel (P5 roles/prisme-fetcher
# + controle de disponibilite) n'est pas confirme. Cf
# saas/prisme/docs/2026-08-03-plan-canary-instagram.md, "5 conditions".
prisme_instagram_adapter_ready: false
prisme_instagram_p5_deployed: false

prisme_frontend_network: "javisi_frontend"
prisme_backend_network: "javisi_backend"
prisme_egress_network: "javisi_egress"
prisme_connector_network: "prisme_connector_internal"
prisme_monitoring_network: "javisi_monitoring"
