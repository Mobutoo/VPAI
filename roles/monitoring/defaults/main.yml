---
# monitoring — defaults

# --- Directories ---
monitoring_config_dir: "/opt/{{ project_name }}/configs"
monitoring_data_dir: "/opt/{{ project_name }}/data"

# --- VictoriaMetrics ---
victoriametrics_retention_period: "30d"
victoriametrics_data_dir: "{{ monitoring_data_dir }}/victoriametrics"

# --- Loki ---
loki_config_dir: "{{ monitoring_config_dir }}/loki"
loki_data_dir: "{{ monitoring_data_dir }}/loki"
loki_retention_period: "336h"  # 14 days
loki_max_query_length: "721h"  # 30 days + 1h

# --- Alloy ---
alloy_config_dir: "{{ monitoring_config_dir }}/alloy"

# --- Grafana ---
grafana_config_dir: "{{ monitoring_config_dir }}/grafana"
grafana_data_dir: "{{ monitoring_data_dir }}/grafana"
grafana_provisioning_dir: "{{ grafana_config_dir }}/provisioning"
grafana_dashboards_dir: "{{ grafana_config_dir }}/dashboards"
# NOTE: grafana_admin_user is set in users.yml (wizard-generated)
# This default is a fallback if users.yml is missing
grafana_admin_user: "admin"
grafana_root_url: "https://{{ caddy_grafana_domain }}/"
grafana_serve_from_sub_path: "false"
# Comma-separated plugin IDs to preinstall (GF_PLUGINS_PREINSTALL_SYNC). Empty by default;
# override per-environment (e.g. inventory/group_vars/prod/main.yml) when a stack's Grafana
# needs a plugin not bundled by default (see HawkTrade repo, infra/grafana/README.md, for the
# yesoreyeram-infinity-datasource precedent).
grafana_plugins_preinstall_sync: ""
