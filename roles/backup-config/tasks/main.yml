---
# backup-config — tasks
# Prepares pre-backup scripts and cron on Seko-AI (production VPS)
# Zerobyte itself runs on Seko-VPN — config is documented in RUNBOOK.md

# === VARS GÉNÉRÉES (brick.yml) ===

- name: Assert brick_backup_env is explicitly set
  ansible.builtin.assert:
    that:
      - brick_backup_env is defined
      - brick_backup_env is string
      - brick_backup_env is match('\A[a-z0-9][a-z0-9_-]*\Z')
    fail_msg: >-
      brick_backup_env doit être défini dans l'inventaire de l'environnement cible
      (jamais un défaut de rôle : un défaut 'sese' ferait hériter silencieusement
      les jobs backup de sese à tout autre environnement — revue Codex 2026-08-05).

- name: Load generated brick backup vars
  ansible.builtin.include_vars:
    file: "bricks_backup_{{ brick_backup_env }}.yml"

# === DIRECTORIES ===

- name: Ensure scripts directory exists
  ansible.builtin.file:
    path: "/opt/{{ project_name }}/scripts"
    state: directory
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0755"
  become: true

- name: Ensure logs directory exists
  ansible.builtin.file:
    path: "/opt/{{ project_name }}/logs"
    state: directory
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0755"
  become: true

# Répertoires briques (roles/*/brick.yml -> brick_backup_tar_jobs, généré par
# scripts/brick_generate.py) : chaque job volume_tar écrit dans
# {{ backup_base_dir }}/<brick> — sans ce mkdir explicite, backup_tar()
# (pre-backup.sh.j2) le crée en root via sudo -n, ce qui redonnerait le trou de
# disque de l'incident 2026-08-04 (répertoire root:root, cleanup impuissant).
- name: Create backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0750"
  loop: >-
    {{ [backup_base_dir, backup_pg_dump_dir, backup_redis_dir, backup_qdrant_dir, backup_n8n_dir, backup_grafana_dir]
       + (brick_backup_tar_jobs | default([]) | map(attribute='brick') | unique
          | map('regex_replace', '^', backup_base_dir ~ '/') | list) }}
  become: true

# === PRE-BACKUP SCRIPT ===

- name: Deploy pre-backup script
  ansible.builtin.template:
    src: pre-backup.sh.j2
    dest: "/opt/{{ project_name }}/scripts/pre-backup.sh"
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0700"
  become: true
  no_log: true
  # REX 2026-07-23 : ce template embarque postgresql/redis/qdrant/grafana en
  # clair (substitution Jinja2). Sans no_log, `diff_always` (ansible.cfg) +
  # `--diff` (Makefile deploy-role) affichent le contenu AVANT/APRÈS en clair
  # — fuite constatée en direct (clé API Qdrant + mot de passe Grafana).

# === CLEANUP SCRIPT ===

- name: Deploy backup cleanup script
  ansible.builtin.template:
    src: backup-cleanup.sh.j2
    dest: "/opt/{{ project_name }}/scripts/backup-cleanup.sh"
    owner: "{{ prod_user }}"
    group: "{{ prod_user }}"
    mode: "0700"
  become: true

# === CRON JOBS ===

- name: Configure pre-backup cron job
  ansible.builtin.cron:
    name: "{{ project_name }}_pre_backup"
    minute: "{{ backup_pre_script_cron_minute }}"
    hour: "{{ backup_pre_script_cron_hour }}"
    job: "/opt/{{ project_name }}/scripts/pre-backup.sh >> /opt/{{ project_name }}/logs/pre-backup.log 2>&1"
    user: "{{ prod_user }}"
  become: true
  when: not (common_molecule_mode | default(false))
  # Cron module reports changed non-idempotently in Docker containers

- name: Configure backup cleanup cron job
  ansible.builtin.cron:
    name: "{{ project_name }}_backup_cleanup"
    minute: "0"
    hour: "4"
    job: "/opt/{{ project_name }}/scripts/backup-cleanup.sh >> /opt/{{ project_name }}/logs/backup-cleanup.log 2>&1"
    user: "{{ prod_user }}"
  become: true
  when: not (common_molecule_mode | default(false))
  # Cron module reports changed non-idempotently in Docker containers
