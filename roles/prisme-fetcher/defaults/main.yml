---
prisme_fetcher_enabled: false
prisme_fetcher_user: prisme-fetcher
prisme_fetcher_group: prisme-fetcher
prisme_fetcher_root: /var/lib/prisme-fetcher
prisme_fetcher_bin: /usr/local/libexec/prisme-fetcher
prisme_fetcher_service: prisme-fetcher.service
# A4 : au moins 3x la taille max d'un media (yt-dlp remux ffmpeg = copie
# temporaire du fichier deja telecharge en plus de l'original pendant la
# fusion audio+video -> jusqu'a x2-x3 le pic disque reel). Aligne sur
# prisme_fetcher_ytdlp_max_filesize (1G) ci-dessous : 3 * 1G.
prisme_fetcher_min_free_bytes: 3221225472
prisme_fetcher_poll_seconds: 2
prisme_fetcher_env_file: /etc/prisme-fetcher/env

# --- Adapters reseau (HTTP generique + yt-dlp generique) ---
# L'adapter Instagram (CANARY) est defini plus bas, avec sa PROPRE allowlist
# (domaine + handle) : il n'utilise JAMAIS prisme_fetcher_allowed_domains
# ci-dessous (cf assert tasks/main.yml qui interdit "instagram.com"/
# "www.instagram.com" ici, precisement pour empecher l'adapter http/ytdlp
# generique de contourner la verification handle+cookies de l'adapter dedie).
#
# Choix stdlib-only (urllib) plutot que python3-requests : le role n'installe
# aujourd'hui AUCUNE dependance Python sur waza, et le controle manuel des
# redirections (obligatoire pour re-verifier l'allowlist a chaque saut, cf
# prisme_fetcher_http_max_redirects) est de toute facon explicite avec l'un
# comme l'autre. urllib evite d'ajouter python3-requests comme dependance apt
# pour un gain marginal.
#
# Allowlist de domaines : VIDE par defaut = tout refus (design). Un job dont
# le domaine (netloc, sans port) n'est pas dans cette liste passe en
# state=rejected avec la raison dans le manifest. AUCUN contournement
# (CAPTCHA/bypass) : hors perimetre par design.
prisme_fetcher_allowed_domains: []
prisme_fetcher_http_user_agent: "PrismeFetcher/1.0 (+https://prisme.ewutelo.cloud)"
prisme_fetcher_http_timeout_seconds: 20
prisme_fetcher_http_max_bytes: 52428800
# Sauts de redirection maximum. L'allowlist est re-verifiee a CHAQUE saut
# (sinon une URL allowlistee qui redirige vers un hote arbitraire est un
# contournement pur et simple).
prisme_fetcher_http_max_redirects: 5
# Prefixes/valeurs Content-Type acceptes (comparaison par prefixe si le motif
# se termine par "/").
prisme_fetcher_http_allowed_content_types:
  - "application/pdf"
  - "text/html"
  - "image/"
  - "audio/"
  - "video/"

# yt-dlp : paquet apt disponible nativement sur la cible reelle du role
# (Ubuntu 24.04 noble, cf meta/main.yml + molecule) — confirme via
# `apt-cache madison yt-dlp` (noble/universe: 2024.04.09-1 ; noble-backports:
# plus recent). On installe le paquet du depot deja active par defaut
# (pas d'activation de backports par ce role — hors perimetre), SANS pin de
# version exacte : les extracteurs yt-dlp perissent vite et epingler une
# version d'archive precise casse le deploiement des qu'elle est retiree du
# miroir a la prochaine mise a jour de securite. Limitation connue a documenter
# au demandeur : yt-dlp noble/main est vieux (~2024-04) ; si la fraicheur des
# extracteurs devient bloquante, activer noble-backports au niveau host
# (hors perimetre de ce role) plutot que d'epingler ici.
prisme_fetcher_ytdlp_apt_package: "yt-dlp"
# Non-vide => pin exact "paquet=version" (maintenance a la charge de
# l'operateur, cf commentaire ci-dessus).
prisme_fetcher_ytdlp_apt_version: ""
prisme_fetcher_ytdlp_format: "best[height<=1080]"
prisme_fetcher_ytdlp_max_filesize: "1G"
# L'allowlist ne couvre que l'URL d'entree soumise au job : les CDN media
# resolus en interne par yt-dlp sont arbitraires et NE SONT PAS re-verifies
# (limitation connue, documentee dans le manifest de sortie).

# Anti-abus : au moins N secondes entre deux fetches vers le meme domaine,
# et backoff exponentiel (base * 2^(attempts-1)) sur echec avant retry.
prisme_fetcher_rate_limit_seconds: 30
prisme_fetcher_max_attempts: 5
prisme_fetcher_retry_backoff_seconds: 60

# --- Adapter Instagram (CANARY, gate humain — cf.
# saas/prisme/docs/2026-08-03-plan-canary-instagram.md) ---
# Desactive par defaut. L'activation reelle passe par l'endpoint gated de
# Prisme (5 conditions verifiees serveur), jamais par ce seul flag.
prisme_instagram_enabled: false
# gallery-dl : pipx pinne EXACT (decision CANARY-0). Le paquet apt noble
# (1.26.9, 2024-04) est trop vieux pour les extracteurs Instagram, et
# l'activation de noble-backports reste hors perimetre du role (meme doctrine
# que yt-dlp ci-dessus). pipx (paquet apt noble 1.4.3) isole le venv et
# garantit la version epinglee — MED revue Codex 2026-08-03 honore.
prisme_instagram_gallery_dl_version: "1.30.2"
# Liste blanche de handles Instagram autorises (comptes de l'operateur ou
# autorisation explicite). VIDE par defaut = tout refus. Un job dont le
# handle n'est pas ici passe en state=rejected.
prisme_instagram_allowed_handles: []
# Delai minimal entre deux requetes Instagram (par compte ET par domaine),
# conservateur par design — jamais de contournement de rate-limit.
prisme_instagram_rate_limit_seconds: 45
# Cookies de session du compte AUTORISE, format Netscape cookies.txt
# OBLIGATOIRE (gallery-dl --cookies ne lit pas de JSON — MED revue Codex).
# Contenu depuis le vault ; default('') pour ne pas casser un deploy ordinaire
# (REX-62 : l'assert fail-loud ne s'applique que sous prisme_instagram_enabled).
# no_log partout ou cette variable est manipulee.
prisme_instagram_cookies_content: "{{ vault_prisme_instagram_cookies | default('') }}"
prisme_instagram_cookies_file: /etc/prisme-fetcher/instagram-cookies.txt
# Nom du secret transmis via systemd LoadCredential (MED revue Codex : le
# fichier reste 0400 root:root sur disque, InaccessiblePaths ne peut pas a la
# fois le cacher ET l'exposer au meme process -> LoadCredential est le seul
# chemin d'acces runtime, copie privee dans $CREDENTIALS_DIRECTORY, jamais en
# argv, jamais logge).
prisme_instagram_credential_name: instagram-cookies

# gallery-dl installe via pipx dans un home dedie HORS /root (masque par
# ProtectHome=true dans l'unite systemd -> le pipx par defaut de root,
# ~/.local/{bin,share/pipx}, serait invisible au runtime).
prisme_instagram_gallery_dl_pipx_home: /opt/pipx
prisme_instagram_gallery_dl_pipx_bin_dir: /usr/local/bin
# H1 (revue 2026-08-03) : chemin REEL invariant sonde/installe par tasks/main.yml
# (jamais surcharge par molecule -> l'idempotence de la sonde pipx --version
# reste correcte a chaque converge). prisme_instagram_gallery_dl_bin ci-dessous
# ne pilote QUE l'invocation du worker au runtime et PEUT etre redirige vers un
# stub deterministe en molecule (verify.yml) sans jamais affecter la sonde
# d'idempotence pipx.
prisme_instagram_gallery_dl_pipx_bin: "{{ prisme_instagram_gallery_dl_pipx_bin_dir }}/gallery-dl"
prisme_instagram_gallery_dl_bin: "{{ prisme_instagram_gallery_dl_pipx_bin }}"

# Plage --range gallery-dl par defaut : DOIT rester "N-M" (borne explicite,
# jamais une plage ouverte). Un job peut fournir sa propre plage (meme motif
# valide) ; sinon ce defaut prudent s'applique.
prisme_instagram_range_default: "1-20"

# H-C (revue 2026-08-03, cycle 2) : borne haute MAXIMALE tolerable pour la
# plage --range d'un job. Sans ce plafond, un job "range": "1-99999" produit
# une deadline theorique de plusieurs mois (H7 : range_upper * (rate_limit +
# http_timeout) * marge) — le worker etant mono-thread et verrouille en
# singleton (M1), TOUT le pipeline (heartbeat compris) serait gele pour la
# duree du job. Un job dont la borne haute depasse cette valeur est rejete
# avant tout appel gallery-dl (state=rejected, reason=range_upper_too_large).
prisme_instagram_range_max_upper: 20

# L1 (revue 2026-08-03, cycle 3) : plafond dur INDEPENDANT de la formule H7
# (range_upper * (rate+http_timeout) * marge) — deriver cette constante de la
# MEME formule appliquee a prisme_instagram_range_max_upper rendait le min()
# de defense en profondeur dans fetch_instagram() un no-op algebrique
# permanent (aucun cas ne pouvait jamais depasser cette "borne"). Valeur
# choisie : large par rapport a la deadline H7 nominale au plafond actuel
# (range_max_upper=20 * (rate 45 + http_timeout 30) * marge 2 = 3000s) tout
# en bornant reellement un scenario ou range_max_upper serait releve sans
# ajuster ce plafond en parallele.
prisme_instagram_max_job_seconds: 7200

# Fichier d'archive gallery-dl (--download-archive) : persistant sous
# prisme_fetcher_root (jamais dans work/<job_id>, purge a chaque job) pour que
# re-executer un job deja acquis ne re-telecharge rien.
prisme_instagram_archive_file: "{{ prisme_fetcher_root }}/instagram-archive.sqlite3"

# Plafond disque dur (A4/A2, meme doctrine que yt-dlp) pour un bundle
# post/carrousel Instagram : tue gallery-dl si depasse pendant l'acquisition.
prisme_instagram_max_bundle_bytes: 524288000

prisme_instagram_http_timeout_seconds: 30

# H7 (revue 2026-08-03) : la deadline d'un job Instagram DOIT etre derivee de
# la borne haute REELLE de --range (jamais une constante fixe : un multiple
# fixe de INSTAGRAM_HTTP_TIMEOUT_SECONDS ne couvre pas le sommeil natif
# gallery-dl --sleep-request applique entre CHAQUE media de la plage, ce qui
# tuait tout job multi-media avant terme -> handle_failure -> retry agressif,
# exactement ce que ce marqueur de conception interdit). Formule dans le
# worker : range_upper * (RATE_LIMIT + HTTP_TIMEOUT) * marge. Marge = facteur
# de securite au-dela du temps theorique minimal (latence reseau, jitter,
# retries internes gallery-dl) ; 2x documente comme volontairement large.
prisme_instagram_deadline_margin: 2

# Marqueurs (sous-chaines, insensibles a la casse) recherches dans stderr
# gallery-dl pour distinguer un blocage terminal (challenge/2FA/rate-limit/
# auth -> state=blocked, AUCUN retry) d'un echec transitoire ordinaire
# (-> retry standard avec backoff, comme http/ytdlp). Configurable pour
# absorber une evolution des messages gallery-dl sans toucher au code.
# M5 (revue 2026-08-03) : les marqueurs PUREMENT numeriques ("401"/"403"/"429")
# sont ancres sur une frontiere de mot (\b) par le worker (classify_instagram_failure)
# pour ne jamais matcher une sous-chaine d'un shortcode/identifiant hostile
# (ex. "C403xyz") — seuls les marqueurs textuels ci-dessous restent en
# sous-chaine simple (deja assez longs pour ne pas produire de faux positif).
prisme_instagram_blocked_markers:
  challenge_required: "blocked:challenge_required"
  checkpoint_required: "blocked:challenge_required"
  checkpoint_challenge: "blocked:challenge_required"
  login_required: "blocked:login_required"
  please log in: "blocked:login_required"
  rate limit: "blocked:rate_limited"
  "429": "blocked:rate_limited"
  "401": "blocked:auth"
  "403": "blocked:auth"
  forbidden: "blocked:auth"

# L4 (revue 2026-08-03) : procedure de reprise operateur pour un job
# state=blocked (challenge/2FA/rate-limit/auth). blocked est TERMINAL par
# design (jamais de retry automatique — cf scan_jobs) et le fichier
# jobs/<sha>.json est garbage-collecte des que l'etat terminal est atteint.
# Pour reprendre l'acquisition d'un post/compte bloque UNE FOIS le blocage
# reel leve cote Instagram (nouvelle session cookies re-deployee via
# prisme_instagram_cookies_content, rate-limit expire, etc.) :
#   1. Ne PAS re-deposer le meme fichier jobs/*.json a l'identique : job_id =
#      sha256(bytes du fichier) -> memes octets = meme job_id = deja
#      terminal en base, jamais rejoue (le fichier serait immediatement
#      re-GC sans nouvelle tentative).
#   2. Soumettre un nouveau job avec un payload distinct (ex. champ "note"
#      incremente/horodate) pour obtenir un nouveau job_id.
#   3. Recours manuel (exceptionnel, arrete le service AVANT toute ecriture
#      SQL directe pour eviter la concurrence avec le lock singleton M1) :
#      DELETE FROM jobs WHERE job_id='<sha256>'; sur
#      {{ prisme_fetcher_root }}/state.sqlite3, puis redeposer le fichier
#      jobs/*.json original.
#      ATTENTION (M1, revue 2026-08-03, cycle 4) : les lignes jobs avec
#      state='done' sont LOAD-BEARING pour la dedup cross-job (cf R1/
#      prior_delivery dans process_instagram_job, template
#      prisme-fetcher.py.j2) — NE JAMAIS DELETE une ligne state='done', meme
#      via ce recours manuel : un autre job_id portant la MEME url s'appuie
#      dessus pour distinguer "deja livre par un autre job" d'un veritable
#      echec. Ce recours ne s'applique qu'a des lignes state='blocked' (ou
#      'failed', cf H-B ci-dessous), jamais 'done'.
#   4. M1 (revue 2026-08-03, cycle 4) : la reprise d'un job blocked/failed NE
#      SUFFIT PAS a elle seule si le meme media a deja ete acquis par
#      gallery-dl AVANT le blocage (archive scopee PAR MEDIA, pas par URL —
#      cf fetch_instagram/--download-archive) : l'archive PERSISTANTE
#      partagee {{ prisme_instagram_archive_file }} contiendrait alors deja
#      l'entree du media, et le nouveau job (nouveau job_id, etape 2) le
#      verrait a nouveau comme "deja acquis" (files_info==[]) au lieu de le
#      re-televerser. Pour forcer une VRAIE re-acquisition reseau du meme
#      contenu :
#        a. Arreter le service : `systemctl stop {{ prisme_fetcher_service }}`
#           (jamais d'ecriture SQL concurrente avec le worker, meme doctrine
#           que l'etape 3).
#        b. Inspecter le schema reel de l'archive AVANT toute suppression —
#           le nom de la table est configurable (gallery-dl "archive-table",
#           defaut "archive") et le nom/format de la colonne cle
#           ("archive-format") ne sont PAS documentes de facon stable par la
#           doc officielle (cf R8/instagram_archive_row_count ci-dessus) :
#           `sqlite3 {{ prisme_instagram_archive_file }} ".schema"` puis
#           `DELETE FROM archive WHERE entry LIKE '%<shortcode_ou_handle>%';`
#           (adapter le nom de table/colonne au schema REELLEMENT observe, a
#           confronter au binaire pipx installe avant CANARY-5 — meme
#           reserve que M-G).
#        c. Redemarrer le service : `systemctl start {{ prisme_fetcher_service }}`.
#        d. Puis suivre les etapes 1-2 ci-dessus (nouveau payload, nouveau
#           job_id).
#
# H-B (revue 2026-08-03, cycle 2) : la MEME procedure de reprise s'applique a
# l'etat state=failed avec reason=instagram_empty_result_no_prior_delivery
# QUAND l'operateur sait que le contenu existe reellement (ex. l'archive de
# dedup a ete purgee/reinitialisee entre-temps, ou le job visait par erreur
# une plage deja entierement livree ailleurs) : soumettre un nouveau job avec
# un payload distinct (etape 2 ci-dessus), jamais redeposer l'original a
# l'identique (meme job_id = deja terminal, re-GC immediat). Meme mise en
# garde M1 qu'a l'etape 4 ci-dessus : la ligne jobs correspondante peut etre
# 'failed' (jamais 'done') et peut donc etre DELETE si necessaire, mais
# purger UNIQUEMENT l'archive gallery-dl (etape 4.b) ne suffit pas non plus
# a elle seule si une AUTRE ligne jobs, distincte, porte deja state='done'
# pour la meme url (prior_delivery) — cette ligne-la reste, par design,
# jamais purgeable.

# L5 (revue 2026-08-03, cycle 4) : procedure operateur — unite en
# "failed"/start-limit-hit permanent. L'unite systemd
# ({{ prisme_fetcher_service }}) porte StartLimitIntervalSec=60 +
# StartLimitBurst=5 (cf prisme-fetcher.service.j2, L3 cycle 3) : au-dela de 5
# echecs en 60s, systemd cesse TOUT redemarrage (Restart=on-failure devient
# inoperant) et l'unite reste "failed" — MORT PERMANENT sans intervention
# manuelle, AUCUN detecteur automatique aujourd'hui (le heartbeat SQLite
# n'a pas de consommateur/alerting cote waza ; l'alerting existant, cf
# roles/waza-deadman, cible la disponibilite globale de waza, pas cette
# unite specifiquement). Recherche effectuee (2026-08-03, L5) : aucune unite
# de notification generique n'existe sur waza a laquelle brancher un
# OnFailure= — volontairement PAS de nouvelle unite creee ici (hors
# perimetre de ce role ; a instruire cote CANARY-5/waza-deadman si le besoin
# se confirme). Procedure operateur, une fois la cause racine du crash-loop
# corrigee (cookies invalides, lock mal possede, disque plein, etc.) :
#   1. `systemctl status {{ prisme_fetcher_service }}` -> confirmer
#      "start-limit-hit" (pas juste "failed" simple).
#   2. `systemctl reset-failed {{ prisme_fetcher_service }}` -> reinitialise
#      le compteur StartLimitBurst (n'efface aucun etat applicatif —
#      state.sqlite3/jobs/manifests intacts).
#   3. `systemctl start {{ prisme_fetcher_service }}`.
# Sans l'etape 2, `systemctl start` echoue immediatement (le compteur reste
# au plafond jusqu'a expiration naturelle de StartLimitIntervalSec ou reset
# explicite).

# M-F (revue 2026-08-03, cycle 2) : retention (en jours) des manifestes de
# traçabilite (manifests/<job_id>.json, TOUS adapters) et des snapshots
# rejects/<job_id>/manifest.json (etats non-succes uniquement, cf M-B).
# Purge par age dans la boucle principale du worker (purge_old_artifacts).
prisme_instagram_artifact_retention_days: 90

# --- Transfert vers banga (etape separee, banga OFFLINE aujourd'hui) ---
# Desactive par defaut : a activer seulement une fois la cle publique
# enrolee cote banga (prisme-transfer uid 2101) ET le repertoire cible
# rendu inscriptible pour ce compte (gate banga, hors perimetre de ce repo).
prisme_transfer_enabled: false
prisme_transfer_service: prisme-transfer.service
prisme_transfer_timer: prisme-transfer.timer
prisme_transfer_target: "prisme-transfer@100.64.0.32:/data/knowledge/incoming/"
prisme_transfer_ssh_port: 22
prisme_transfer_ssh_key: "{{ prisme_fetcher_root }}/.ssh/id_ed25519"
prisme_transfer_known_hosts_file: "{{ prisme_fetcher_root }}/.ssh/known_hosts"
prisme_transfer_interval_seconds: 300

# --- Contrat fetcher <-> control-plane Prisme (CANARY-1b, cf.
# saas/prisme/docs/2026-08-03-plan-canary-instagram.md, section "Contrat
# fetcher" -- deux routes authentifiees PRISME_FETCHER_TOKEN, hors session
# operateur : GET .../connectors/instagram/authorization et POST
# .../connectors/instagram/heartbeat). Vide par defaut : assert fail-loud
# (tasks/main.yml) des que prisme_instagram_enabled.
prisme_instagram_api_base: ""
prisme_instagram_tenant_id: ""
prisme_instagram_api_timeout_seconds: 10
# Contrat : <=60s. 45s laisse une marge (jitter reseau, GC purge, boucle
# d'attente d'un job long) sans jamais approcher la fenetre de fraicheur
# serveur 90s (1,5x la cadence attendue -- gate 5).
prisme_instagram_heartbeat_interval_seconds: 45
# Throttle des VERIFICATIONS d'autorisation, par PASSE DE SCAN (pas par job,
# pas un cache de verdict) : le worker scanne jobs/ toutes les
# prisme_fetcher_poll_seconds (2s par defaut) -- sans throttle, N jobs
# Instagram en attente saturent en quelques secondes le bucket fetcher
# partage cote prisme (120 req/60s/tenant, cf dispatcher.ts
# INSTAGRAM_FETCHER_RATE_LIMIT, PARTAGE avec le heartbeat). Une verification
# reste FRAICHE (jamais un verdict positif reutilise) avant CHAQUE tentative
# reelle d'acquisition : ce throttle ne fait que borner la cadence des passes
# de scan qui echouent a atteindre l'acquisition faute de fenetre ecoulee.
prisme_instagram_authorization_poll_seconds: 20
# CIDR (typiquement /32) perce dans IPAddressDeny=...100.64.0.0/10... de
# l'unite systemd (A5, garde SSRF -- prisme-fetcher.service.j2) pour que CE
# SEUL hote tailnet (le control-plane prisme) reste joignable malgre le
# deny generique du reste du tailnet. systemd ne resout PAS les noms d'hote
# dans IPAddressAllow=/IPAddressDeny= (IP uniquement) : cette valeur DOIT
# donc etre tenue a jour manuellement en synchronisation avec l'IP tailnet
# reelle derriere prisme_instagram_api_base (aujourd'hui
# prisme.ewutelo.cloud -> Sese-AI, 100.64.0.14 -- verifie `dig +short
# prisme.ewutelo.cloud`). Verifie (doc officielle locale, `man
# systemd.resource-control`, section IPAddressAllow=/IPAddressDeny= : "prefixe
# le plus specifique gagne", coherent avec le design deja en prod de cette
# unite qui combine IPAddressAllow=any avec des IPAddressDeny= plus
# specifiques) : un IPAddressAllow=/32 gagne toujours face a
# IPAddressDeny=.../10 englobant, quel que soit l'ordre des directives.
prisme_instagram_api_allow_cidr: "100.64.0.14/32"
