---
- name: Converge Prisme fetcher
  hosts: all
  become: true
  vars:
    common_molecule_mode: true
    prisme_fetcher_enabled: true
    vault_prisme_fetcher_token: molecule-fetcher-token-32-characters
    # Pas de reseau en molecule : allowlist volontairement vide -> tout job
    # http/ytdlp doit etre rejete (verifie par verify.yml).
    prisme_fetcher_allowed_domains: []
  pre_tasks:
    - name: Create service group
      ansible.builtin.group:
        name: prisme-fetcher
        system: true
    - name: Install acl (required for become_user to a nologin service account in verify.yml)
      ansible.builtin.apt:
        name: acl
        state: present
        update_cache: true
        cache_valid_time: 3600
  roles:
    - role: prisme-fetcher
