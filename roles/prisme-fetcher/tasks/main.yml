---
- name: Prisme fetcher | Validate disabled-by-default deployment contract
  ansible.builtin.assert:
    that:
      - prisme_fetcher_enabled | bool
      - vault_prisme_fetcher_token is defined
      - vault_prisme_fetcher_token | length >= 32
    quiet: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Create service group
  ansible.builtin.group:
    name: "{{ prisme_fetcher_group }}"
    system: true
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Create restricted service account
  ansible.builtin.user:
    name: "{{ prisme_fetcher_user }}"
    group: "{{ prisme_fetcher_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Create durable state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prisme_fetcher_user }}"
    group: "{{ prisme_fetcher_group }}"
    mode: "0750"
  loop:
    - "{{ prisme_fetcher_root }}"
    - "{{ prisme_fetcher_root }}/incoming"
    - "{{ prisme_fetcher_root }}/outgoing"
    - "{{ prisme_fetcher_root }}/jobs"
    - "{{ prisme_fetcher_root }}/work"
    - "{{ prisme_fetcher_root }}/rejects"
    # M7 (revue 2026-08-03) : un manifeste par job_id, ecrit pour TOUT etat
    # terminal (rejected/blocked/failed/done) — traçabilite independante de
    # toute deduplication par digest de bundle (deux jobs distincts peuvent
    # produire le meme digest de contenu ; le manifeste par job_id, lui,
    # n'est jamais partage).
    - "{{ prisme_fetcher_root }}/manifests"
    - "{{ prisme_fetcher_root }}/.cache"
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Ensure the singleton worker lock file is owned by the service account (L3 — crash-loop guard)
  # L3 (revue 2026-08-03, cycle 3, M-E cycle 2) : le lock singleton M1
  # (ROOT/.worker.lock) est ouvert en mode "a+" par le worker au demarrage —
  # s'il finissait par etre cree/possede par un compte autre que
  # {{ prisme_fetcher_user }} (ex. inspection manuelle en root avant que ce
  # role n'ait tourne), le worker (qui s'execute TOUJOURS comme
  # {{ prisme_fetcher_user }}, cf User= dans l'unite) recevrait un
  # PermissionError a l'ouverture -> crash-loop bruyant (borne desormais par
  # StartLimitIntervalSec/Burst ci-dessus, mais autant ne jamais l'atteindre).
  # `state: touch` + preserve les timestamps -> idempotent (0 changed au 2e
  # run) si le fichier existe deja avec la bonne propriete.
  ansible.builtin.file:
    path: "{{ prisme_fetcher_root }}/.worker.lock"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: "{{ prisme_fetcher_user }}"
    group: "{{ prisme_fetcher_group }}"
    mode: "0640"
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Create local executable directory
  ansible.builtin.file:
    path: "{{ prisme_fetcher_bin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install yt-dlp adapter dependency (apt, generic)
  ansible.builtin.apt:
    name: >-
      {{ prisme_fetcher_ytdlp_apt_package
         ~ ('=' + prisme_fetcher_ytdlp_apt_version if prisme_fetcher_ytdlp_apt_version else '') }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Create environment directory
  ansible.builtin.file:
    path: "{{ prisme_fetcher_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Deploy worker environment file (control-plane token)
  ansible.builtin.template:
    src: prisme-fetcher.env.j2
    dest: "{{ prisme_fetcher_env_file }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: Prisme fetcher | Restart
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install local-fixture + network acquisition worker
  ansible.builtin.template:
    src: prisme-fetcher.py.j2
    dest: "{{ prisme_fetcher_bin }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Prisme fetcher | Restart
  tags: [prisme-fetcher, prisme_fetcher, phase3]

# --- Adapter Instagram (CANARY) --------------------------------------------
# Gate humain reel = l'endpoint prisme applicatif (5 conditions, hors perimetre
# de ce role). Ici : fail-loud si active sans prerequis, jamais de secret loggue.
#
# H2 (revue 2026-08-03) : ce bloc entier (repertoire + cookies + pipx) DOIT
# rester place AVANT « Install hardened service »/« Enable local fixture
# worker » ci-dessous. L'unite systemd contient LoadCredential= (obligatoire
# quand prisme_instagram_enabled) qui echoue "Failed to set up credentials"
# si le fichier source n'existe pas encore au moment ou systemd demarre
# l'unite — a la toute premiere installation canary, la sequence inverse
# faisait echouer le play a `state: started`.

- name: Prisme fetcher | Assert generic HTTP/ytdlp allowlist never grants instagram.com domain access (contournement guard)
  vars:
    # H3 (revue 2026-08-03) : reproduit exactement la semantique de
    # domain_allowed() cote worker — un pattern a point initial matche par
    # egalite (host == pattern[1:]) OU par suffixe (host.endswith(pattern)).
    # Un simple test de sous-chaine (l'ancien assert) laissait passer
    # ".instagram.com" (point initial) ou un pattern large type ".com" qui
    # matcherait "instagram.com" par suffixe — les deux rouvriraient
    # instagram.com aux adapters http/ytdlp generiques (sans handle, sans
    # cookies, sans rate-limit IG).
    # M-D (revue 2026-08-03, cycle 2) : l'assert cycle 1 ne testait que les
    # variantes exactes instagram.com/www.instagram.com — un motif exact
    # "m.instagram.com" (ou tout autre sous-domaine explicite) passait sans
    # etre catch. Fix : suffixe GENERIQUE — tout motif (point initial retire
    # pour la comparaison) egal a "instagram.com" ou se terminant par
    # ".instagram.com" est rejete, quel que soit le sous-domaine explicite
    # vise ; les motifs a point initial conservent en plus la verification
    # H3 (suffixe large type ".com" qui matcherait instagram.com par
    # endswith() cote worker).
    _instagram_domain_allowlist_hit: >-
      {%- set ns = namespace(hit=false) -%}
      {%- for _raw in prisme_fetcher_allowed_domains -%}
        {%- set _p = _raw | trim | lower -%}
        {%- set _bare = _p[1:] if _p.startswith('.') else _p -%}
        {%- if _bare == 'instagram.com' or _bare.endswith('.instagram.com') -%}
          {%- set ns.hit = true -%}
        {%- elif _p.startswith('.') and 'instagram.com'.endswith(_p) -%}
          {%- set ns.hit = true -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.hit }}
  ansible.builtin.assert:
    that:
      - not (_instagram_domain_allowlist_hit | bool)
    quiet: true
    fail_msg: >-
      prisme_fetcher_allowed_domains (adapters http/ytdlp generiques) contient
      un motif dont la forme resolue est instagram.com OU un de ses
      sous-domaines (egalite exacte, point initial, suffixe ".instagram.com",
      ou suffixe large type ".com" — espaces/casse normalises avant
      comparaison) — cela contournerait la verification handle+cookies dediee
      de l'adapter Instagram.
  when: prisme_instagram_enabled | bool
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Validate Instagram adapter prerequisites (fail-loud)
  vars:
    # R4 (revue 2026-08-03, cycle 3) : extraction fail-safe de la borne haute
    # de prisme_instagram_range_default — jamais un split()[1] direct (une
    # valeur hors format "N-M", ex. "abc" ou sans tiret, produirait un
    # IndexError qui casserait la TACHE elle-meme au lieu du fail-loud
    # `fail_msg` ci-dessous ; l'autre condition du `that` verifie deja le
    # format complet, mais les vars sont evaluees AVANT le `that`).
    # ATTENTION (verifie localement, ansible-core) : regex_search(pattern,
    # groupe) AVEC un seul groupe de capture retourne une LISTE (['20']),
    # PAS une chaine — `| int` sur une liste retombe silencieusement a 0 SANS
    # jamais lever d'erreur (l'assert passerait alors TOUJOURS, quelle que
    # soit la vraie valeur : bug constate puis corrige avant commit, jamais
    # deploye). Fix : regex_search SANS groupe (retourne la chaine complete
    # du match, "-20") puis slice `[1:]` pour retirer le "-" — jamais de
    # groupe de capture ici. Un regex_search qui ne matche pas rend None ->
    # default('-0', true) -> "-0"[1:] -> "0" -> 0, ce qui fait echouer la
    # comparaison (donc l'assert) sans jamais lever d'exception de
    # templating.
    _range_default_upper: "{{ ((prisme_instagram_range_default | regex_search('-([0-9]+)$')) | default('-0', true))[1:] | int }}"
    # M2 (revue 2026-08-03, cycle 4) : meme piege/meme patron corrige que
    # _range_default_upper ci-dessus — regex_search AVEC un groupe de capture
    # retourne une LISTE (ex. ['20']), jamais une chaine, et `| int` sur une
    # liste retombe silencieusement a 0 SANS lever d'erreur de templating
    # (l'assert passerait alors TOUJOURS quelle que soit la vraie borne
    # basse). Fix : regex_search SANS groupe (retourne la chaine complete du
    # match, "10-") puis slice `[:-1]` pour retirer le "-" final — jamais de
    # groupe de capture. Un regex_search qui ne matche pas rend None ->
    # default('0-', true) -> "0-"[:-1] -> "0" -> 0.
    _range_default_lower: "{{ ((prisme_instagram_range_default | regex_search('^[0-9]+-')) | default('0-', true))[:-1] | int }}"
  ansible.builtin.assert:
    that:
      - prisme_instagram_cookies_content | default('') | length > 0
      - prisme_instagram_allowed_handles | length > 0
      - prisme_instagram_range_default is match('^[0-9]+-[0-9]+$')
      - _range_default_upper <= (prisme_instagram_range_max_upper | int)
      - _range_default_lower <= _range_default_upper
    quiet: true
    fail_msg: >-
      prisme_instagram_enabled=true mais un prerequis manque : cookies vides,
      allowlist de handles vide, prisme_instagram_range_default hors format
      "N-M", (REX-62/R4) la borne haute de prisme_instagram_range_default
      depasse prisme_instagram_range_max_upper (le defaut serait alors
      rejete par le worker lui-meme, range_upper_too_large, des le premier
      job sans range explicite), ou (M2) la borne basse depasse la borne
      haute (le worker rejetterait alors TOUS les jobs sans range explicite,
      reason=invalid_range).
  when: prisme_instagram_enabled | bool
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Compute Instagram cookies Netscape-format booleans (contains secret material — no_log)
  vars:
    _cookies_trimmed: "{{ prisme_instagram_cookies_content | trim }}"
    _cookies_first_char: "{{ _cookies_trimmed[0] | default('') }}"
    # M3 (revue 2026-08-03) : "#HttpOnly_" est un PREFIXE de ligne de DONNEE
    # (export navigateur standard pour un cookie HttpOnly, ex. sessionid) —
    # jamais un commentaire. Le strip AVANT le rejet des vrais commentaires
    # ('^\s*#' generique) empeche de perdre silencieusement la ligne
    # sessionid la plus courante.
    _cookies_data_lines: >-
      {{ _cookies_trimmed.splitlines()
         | map('regex_replace', '^#HttpOnly_', '')
         | reject('match', '^\s*#')
         | reject('match', '^\s*$')
         | list }}
    _cookies_netscape_lines: >-
      {{ _cookies_data_lines
         | select('match', '^([^\t]+\t){6}[^\t]*$')
         | list }}
    # Ligne Netscape complete pour le domaine instagram avec champ6==sessionid
    # et champ5(expiration) numerique (0 = cookie de session, jamais expire ;
    # sinon compare a l'horodatage courant plus bas).
    _cookies_sessionid_lines: >-
      {{ _cookies_netscape_lines
         | select('match', '(?i)^\.?(www\.)?instagram\.com\t[^\t]+\t[^\t]+\t[^\t]+\t\d+\tsessionid\t')
         | list }}
    _cookies_sessionid_expirations: >-
      {{ _cookies_sessionid_lines
         | map('regex_replace', '(?i)^\.?(www\.)?instagram\.com\t[^\t]+\t[^\t]+\t[^\t]+\t(\d+)\tsessionid\t.*$', '\2')
         | map('int')
         | list }}
    _now_epoch: "{{ now(utc=true, fmt='%s') | int }}"
  ansible.builtin.set_fact:
    prisme_instagram_cookies_first_char_ok: "{{ _cookies_first_char not in ['{', '['] }}"
    prisme_instagram_cookies_has_data: "{{ (_cookies_data_lines | length) > 0 }}"
    prisme_instagram_cookies_all_netscape: "{{ (_cookies_netscape_lines | length) == (_cookies_data_lines | length) }}"
    prisme_instagram_cookies_has_fresh_sessionid: >-
      {{ (_cookies_sessionid_lines | length) > 0
         and ((_cookies_sessionid_expirations | select('equalto', 0) | list | length) > 0
              or (_cookies_sessionid_expirations | select('gt', _now_epoch | int) | list | length) > 0) }}
  no_log: true
  when: prisme_instagram_enabled | bool
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Assert Instagram cookies are Netscape format with a live sessionid cookie (not JSON, not expired)
  ansible.builtin.assert:
    that:
      - prisme_instagram_cookies_first_char_ok
      - prisme_instagram_cookies_has_data
      - prisme_instagram_cookies_all_netscape
      - prisme_instagram_cookies_has_fresh_sessionid
    quiet: true
    fail_msg: >-
      prisme_instagram_cookies_content ne ressemble pas a un cookies.txt
      Netscape valide pour instagram.com avec une ligne sessionid presente ET
      non expiree (7 champs tabules par ligne hors commentaires/lignes vides,
      "#HttpOnly_" traite comme donnee, champ5=expiration 0 ou future) —
      gallery-dl --cookies n'accepte pas de JSON. Reexporter au format
      Netscape (ex. extension navigateur "Get cookies.txt").
  when: prisme_instagram_enabled | bool
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Create Instagram cookies directory
  ansible.builtin.file:
    path: "{{ prisme_instagram_cookies_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: prisme_instagram_enabled | bool
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Deploy Instagram session cookies (Netscape format, 0400 root:root)
  ansible.builtin.copy:
    content: "{{ prisme_instagram_cookies_content }}"
    dest: "{{ prisme_instagram_cookies_file }}"
    owner: root
    group: root
    mode: "0400"
  become: true
  no_log: true
  when: prisme_instagram_enabled | bool
  notify: Prisme fetcher | Restart
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Remove Instagram cookies file when adapter disabled (revocation hygiene)
  # L3 (revue 2026-08-03, decision explicite) : SEUL le secret (cookies) est
  # retire au disable. gallery-dl (pipx) et l'archive de dedup
  # (prisme_instagram_archive_file) restent volontairement en place :
  # (a) gallery-dl est un binaire sans valeur de renseignement, le conserver
  #     evite un re-telechargement pipx complet a une reactivation future ;
  # (b) l'archive de dedup n'a de sens QUE persistante entre activations —
  #     la purger casserait l'idempotence d'acquisition (H5/H6) a chaque
  #     cycle disable/enable, sans aucun gain de securite (elle ne contient
  #     que des identifiants d'entree gallery-dl, jamais de cookies/PII).
  # Le secret, lui, DOIT disparaitre : c'est la seule donnee sensible ici.
  ansible.builtin.file:
    path: "{{ prisme_instagram_cookies_file }}"
    state: absent
  become: true
  when: not (prisme_instagram_enabled | bool)
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install pipx (Instagram adapter dependency manager)
  ansible.builtin.apt:
    name: pipx
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: prisme_instagram_enabled | bool
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Create dedicated pipx home for gallery-dl (outside ProtectHome=true blast radius)
  ansible.builtin.file:
    path: "{{ prisme_instagram_gallery_dl_pipx_home }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: prisme_instagram_enabled | bool
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Probe currently installed gallery-dl version (idempotence)
  # H1 (revue 2026-08-03) : sonde le chemin REEL invariant
  # (prisme_instagram_gallery_dl_pipx_bin), jamais
  # prisme_instagram_gallery_dl_bin (qui ne pilote que l'invocation worker et
  # peut pointer vers un stub molecule) — sinon la sonde echoue a chaque
  # converge des que le stub est actif, et "pipx install --force" repasse
  # changed=true a chaque run (idempotence cassee, H1).
  ansible.builtin.command:
    cmd: "{{ prisme_instagram_gallery_dl_pipx_bin }} --version"
  environment:
    PIPX_HOME: "{{ prisme_instagram_gallery_dl_pipx_home }}"
    PIPX_BIN_DIR: "{{ prisme_instagram_gallery_dl_pipx_bin_dir }}"
  become: true
  register: prisme_instagram_gallery_dl_installed
  changed_when: false
  failed_when: false
  when: prisme_instagram_enabled | bool
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install gallery-dl via pipx (pinned exact version)
  ansible.builtin.command:
    cmd: "pipx install --force gallery-dl=={{ prisme_instagram_gallery_dl_version }}"
  environment:
    PIPX_HOME: "{{ prisme_instagram_gallery_dl_pipx_home }}"
    PIPX_BIN_DIR: "{{ prisme_instagram_gallery_dl_pipx_bin_dir }}"
  become: true
  vars:
    # L2 (revue 2026-08-03) : comparaison EXACTE du dernier token de sortie
    # (jamais une sous-chaine — "1.30.2" est une sous-chaine de "1.30.20").
    # gallery-dl --version imprime potentiellement "gallery-dl 1.30.2" ou
    # juste "1.30.2" selon la version -> on ne compare que le dernier
    # token espace-separe, jamais la chaine entiere.
    _installed_version: >-
      {{ (prisme_instagram_gallery_dl_installed.stdout | default('') | trim).split(' ') | last }}
  when: >-
    prisme_instagram_enabled | bool
    and (prisme_instagram_gallery_dl_installed.rc | default(1) != 0
         or _installed_version != prisme_instagram_gallery_dl_version)
  changed_when: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install hardened service
  ansible.builtin.template:
    src: prisme-fetcher.service.j2
    dest: "/etc/systemd/system/{{ prisme_fetcher_service }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Prisme fetcher | Reload systemd
    - Prisme fetcher | Restart
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Enable local fixture worker
  ansible.builtin.systemd_service:
    name: "{{ prisme_fetcher_service }}"
    enabled: true
    state: started
  become: true
  when: not (common_molecule_mode | default(false) | bool)
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Create SSH directory for the banga transfer step
  ansible.builtin.file:
    path: "{{ prisme_transfer_ssh_key | dirname }}"
    state: directory
    owner: "{{ prisme_fetcher_user }}"
    group: "{{ prisme_fetcher_group }}"
    mode: "0700"
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Generate dedicated transfer SSH keypair (idempotent)
  community.crypto.openssh_keypair:
    path: "{{ prisme_transfer_ssh_key }}"
    type: ed25519
    owner: "{{ prisme_fetcher_user }}"
    group: "{{ prisme_fetcher_group }}"
    mode: "0600"
    comment: "prisme-fetcher@{{ ansible_facts['hostname'] }}"
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Read generated public key
  ansible.builtin.slurp:
    src: "{{ prisme_transfer_ssh_key }}.pub"
  become: true
  register: prisme_transfer_pubkey
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | GATE — enroll this public key on banga (prisme-transfer, uid 2101)
  ansible.builtin.debug:
    msg: >-
      Cle publique du transfert Prisme a enroler manuellement cote banga
      (compte prisme-transfer uid 2101, ~/.ssh/authorized_keys) et a ajouter
      a {{ prisme_transfer_known_hosts_file }} (host key banga) AVANT
      d'activer prisme_transfer_enabled: {{ prisme_transfer_pubkey.content | b64decode | trim }}
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Ensure known_hosts placeholder exists (populated by the banga enrolment gate)
  ansible.builtin.file:
    path: "{{ prisme_transfer_known_hosts_file }}"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: "{{ prisme_fetcher_user }}"
    group: "{{ prisme_fetcher_group }}"
    mode: "0600"
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install banga transfer dependencies (rsync, ssh client)
  ansible.builtin.apt:
    name:
      - rsync
      - openssh-client
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install banga transfer script
  ansible.builtin.template:
    src: prisme-transfer.sh.j2
    dest: "{{ prisme_fetcher_bin }}-transfer"
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Prisme fetcher | Reload systemd
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install banga transfer service (oneshot)
  ansible.builtin.template:
    src: prisme-transfer.service.j2
    dest: "/etc/systemd/system/{{ prisme_transfer_service }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Prisme fetcher | Reload systemd
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Install banga transfer timer
  ansible.builtin.template:
    src: prisme-transfer.timer.j2
    dest: "/etc/systemd/system/{{ prisme_transfer_timer }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Prisme fetcher | Reload systemd
  tags: [prisme-fetcher, prisme_fetcher, phase3]

- name: Prisme fetcher | Enable/disable banga transfer timer per prisme_transfer_enabled
  ansible.builtin.systemd_service:
    name: "{{ prisme_transfer_timer }}"
    enabled: "{{ prisme_transfer_enabled | bool }}"
    state: "{{ 'started' if prisme_transfer_enabled | bool else 'stopped' }}"
  become: true
