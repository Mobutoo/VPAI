        patterns: "*.json"
      register: instagram_all_manifests

    - name: Slurp all per-job manifests from the TARGET host (R5/R1)
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ instagram_all_manifests.files }}"
      register: instagram_all_manifests_slurped

    - name: Assert Instagram dedup job B was marked done+archive_overlap (R1 — job-scoped proof via jobs, never a global signal)
      vars:
        # L3 (revue 2026-08-03, cycle 4) : la version cycle 3 joignait TOUS
        # les manifestes (job A ET job B) avant de chercher les marqueurs —
        # une simple recherche de PRESENCE dans ce texte joint ne pouvait
        # jamais prouver le contrat L5 ("le manifeste archive_overlap ne
        # porte JAMAIS files/delivered_count"), puisque le manifeste de job A
        # (livraison reelle, dans le MEME texte joint) porte legitimement
        # files/delivered_count — une assertion d'ABSENCE sur le texte joint
        # aurait donc toujours echoue, meme si job B respectait le contrat.
        # Fix : isoler le SEUL manifeste qui porte archive_overlap, puis
        # asserter presence des marqueurs ET absence de files/delivered_count
        # dans CE manifeste precis.
        _archive_overlap_manifests: >-
          {{ instagram_all_manifests_slurped.results
             | map(attribute='content') | map('b64decode')
             | select('search', '"partial_reason": "archive_overlap"') | list }}
        _archive_overlap_manifest: "{{ _archive_overlap_manifests[0] | default('') }}"
      ansible.builtin.assert:
        that:
          # Exactement un manifeste porte archive_overlap (job B) — ni zero
          # (le marqueur n'a jamais ete pose), ni plusieurs (contamination
          # d'un autre scenario du meme banc molecule).
          - _archive_overlap_manifests | length == 1
          # L5 : contrat H-B fige — le manifeste de job B porte
          # skipped_already_acquired/partial/partial_reason, JAMAIS
          # files/delivered_count (aucun media n'a ete acquis par CE job).
          - >-
            _archive_overlap_manifest is search('"skipped_already_acquired": true')
          - >-
            _archive_overlap_manifest is not search('"files":')
          - >-
            _archive_overlap_manifest is not search('"delivered_count":')

    - name: Run a THIRD worker pass — the blocked job must NOT retry (terminal state, GC'd)
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
        # CANARY-1b : le worker consomme desormais PRISME_FETCHER_TOKEN
        # au runtime (os.environ) pour authentifier authorization/heartbeat
        # aupres du stub control-plane -- ce fichier invoque le binaire hors
        # systemd (EnvironmentFile= n'est jamais source ici), donc le jeton
        # doit etre passe explicitement, meme valeur que
        # vault_prisme_fetcher_token (converge.yml).
        PRISME_FETCHER_TOKEN: molecule-fetcher-token-32-characters
      become: true
      become_user: prisme-fetcher
      changed_when: false

    # R5/M-G (revue 2026-08-03, cycle 3) : "nouser" reste volontairement
    # EXCLU — son etat est retry_wait (1 tentative < MAX_ATTEMPTS), pas un
    # etat terminal (done/rejected/failed/blocked) : scan_jobs() ne GC que les
    # etats terminaux (cf commentaire GC dans le worker), retry_wait est donc
    # cense survivre jusqu'a l'epuisement des tentatives ou une reprise
    # operateur legitime. L'inclure ici casserait la distinction
    # retriable/terminal que ce meme scenario est cense demontrer.
    - name: Verify the blocked/rejected/carousel/dedup job files were garbage-collected (terminal states, never re-processed)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/jobs
        patterns: "molecule-instagram-*.json"
        excludes: "molecule-instagram-nouser.json"
      register: instagram_jobs_leftover

    - name: Assert zero terminal-state Instagram job files remain (no retry loop on terminal states, incl. blocked)
      ansible.builtin.assert:
        that:
          - instagram_jobs_leftover.matched == 0

    - name: Verify the retriable nouser job file still exists (R5/M-G — retry_wait is not GC'd, unlike a terminal state)
      ansible.builtin.stat:
        path: /var/lib/prisme-fetcher/jobs/molecule-instagram-nouser.json
      register: nouser_job_leftover

    - name: Assert the nouser job stayed in DB-tracked retry_wait (never silently dropped, never terminal)
      ansible.builtin.assert:
        that:
          - nouser_job_leftover.stat.exists

    # --- Contrat fetcher <-> control-plane Prisme (CANARY-1b, 3 scenarios) -

    - name: Flip the fetcher control-plane stub to authorized:false (revoked)
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-authz-mode
        content: "false"
        mode: "0644"

    - name: Count manifests before the authz-denied scenario (M-B — baseline, mirrors the badtoken pattern)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/manifests
        patterns: "*.json"
      register: manifests_before_authz_denied

    - name: Drop an Instagram job while the control-plane reports authorized:false
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-authz-denied.json
        content: |
          {"url": "https://www.instagram.com/operator_test/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: authorized:false (CANARY-1b)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Run a worker pass while the control-plane denies authorization (CANARY-1b)
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
        PRISME_FETCHER_TOKEN: molecule-fetcher-token-32-characters
      become: true
      become_user: prisme-fetcher
      changed_when: false

    - name: Verify the authz-denied job file was NOT garbage-collected (re-poll contract — never terminal, never GC'd)
      ansible.builtin.stat:
        path: /var/lib/prisme-fetcher/jobs/molecule-instagram-authz-denied.json
      register: authz_denied_job_leftover

    - name: Assert the authz-denied job stayed pending (no attempt consumed, no manifest — distinct from a real acquisition failure)
      ansible.builtin.assert:
        that:
          - authz_denied_job_leftover.stat.exists

    - name: Count manifests after the authz-denied scenario (M-B — must be unchanged, no acquisition attempted)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/manifests
        patterns: "*.json"
      register: manifests_after_authz_denied

    - name: Assert the authz-denied scenario never reached process_instagram_job (no manifest leak — M-B baseline/after, not a vacuous contains match)
      ansible.builtin.assert:
        that:
          - manifests_after_authz_denied.matched == manifests_before_authz_denied.matched

    # --- C1 (revue 2026-08-03, cycle 4) : 404 not_provisioned ---------------

    - name: Flip the fetcher control-plane stub to 404 (connector not provisioned, C1)
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-authz-mode
        content: "404"
        mode: "0644"

    - name: Count manifests before the not-provisioned scenario (M-B — baseline, mirrors the badtoken pattern)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/manifests
        patterns: "*.json"
      register: manifests_before_not_provisioned

    - name: Drop an Instagram job while the control-plane reports 404 (not provisioned, C1)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-authz-not-provisioned.json
        content: |
          {"url": "https://www.instagram.com/operator_test/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: 404 not_provisioned (C1, CANARY-1b)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Run a worker pass while the control-plane reports 404 (C1 — must behave exactly like authorized:false)
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
        PRISME_FETCHER_TOKEN: molecule-fetcher-token-32-characters
      become: true
      become_user: prisme-fetcher
      changed_when: false
      register: not_provisioned_pass

    # MED (revue 2026-08-03) : les asserts precedents ne verifiaient que la
    # PRESENCE fichier/DB, jamais l'evenement JSON reellement emis par le
    # worker sur cette passe -- reste vacus (aurait pu passer vert meme si le
    # worker n'avait jamais reellement classe le verdict). Cf commentaire M-A
    # plus bas (:1130) : le tri alphabetique place authz-denied AVANT
    # authz-not-provisioned, donc c'est le job DENIED (deja pending depuis la
    # passe precedente) qui execute reellement la verification reseau ici et
    # recoit le 404 -- c'est SON evenement instagram_authorization_denied
    # qu'on retrouve dans le stdout de CETTE passe.
    - name: Assert this pass really observed the 404 verdict (instagram_authorization_denied, state=not_provisioned)
      ansible.builtin.assert:
        that:
          - "'\"state\": \"not_provisioned\"' in not_provisioned_pass.stdout"
        fail_msg: >-
          Attendu un evenement instagram_authorization_denied avec
          state=not_provisioned dans le stdout de cette passe (C1) : le job
          DENIED, traite en premier par tri alphabetique, doit avoir recu le
          verdict 404 reel du control-plane : {{ not_provisioned_pass.stdout }}

    - name: Verify the not-provisioned job file was NOT garbage-collected (C1 — pending, never terminal)
      ansible.builtin.stat:
        path: /var/lib/prisme-fetcher/jobs/molecule-instagram-authz-not-provisioned.json
      register: authz_not_provisioned_job_leftover

    - name: Assert the not-provisioned job stayed pending (no attempt consumed, no manifest)
      ansible.builtin.assert:
        that:
          - authz_not_provisioned_job_leftover.stat.exists

    - name: Read the DB state for the not-provisioned job (C1/H2 — pending, zero attempts, never a terminal state)
      ansible.builtin.command:
        cmd: >-
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('/var/lib/prisme-fetcher/state.sqlite3')
          rows = conn.execute(
              \"select state, attempts from jobs where note like '%not_provisioned%'\"
          ).fetchall()
          print(rows)
          "
      register: authz_not_provisioned_state
      changed_when: false

    - name: Assert the not-provisioned job is pending with zero attempts (C1 — a 404 is a real verdict, never a failure)
      ansible.builtin.assert:
        that:
          - "\"('pending', 0)\" in authz_not_provisioned_state.stdout"
        fail_msg: >-
          Attendu state=pending, attempts=0 (C1 -- un 404 (not_provisioned)
          doit se comporter EXACTEMENT comme authorized:false, jamais
          consommer de tentative ni atteindre un etat terminal) :
          {{ authz_not_provisioned_state.stdout }}

    - name: Count manifests after the not-provisioned scenario (M-B — must be unchanged, no acquisition attempted)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/manifests
        patterns: "*.json"
      register: manifests_after_not_provisioned

    - name: Assert the not-provisioned scenario never reached process_instagram_job (no manifest leak — M-B baseline/after, not a vacuous contains match)
      ansible.builtin.assert:
        that:
          - manifests_after_not_provisioned.matched == manifests_before_not_provisioned.matched

    # M-A (revue GO cycle 2) : le job authorized:false (denied) est toujours
    # pending et re-poll a CHAQUE passe (jamais GC, jamais terminal) ; le tri
    # alphabetique des fichiers de jobs place "authz-denied" AVANT
    # "authz-not-provisioned" dans le meme --once, donc c'est LUI qui execute
    # reellement la verification reseau du control-plane a cette passe. On
    # verifie ici son etat DB (pas seulement sa presence fichier, deja faite
    # plus haut) pour prouver que ce re-poll ne consomme toujours aucune
    # tentative apres la passe 404.
    - name: Read the DB state for the authorized:false (denied) job after the 404 pass (M-A)
      ansible.builtin.command:
        cmd: >-
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('/var/lib/prisme-fetcher/state.sqlite3')
          rows = conn.execute(
              \"select state, attempts from jobs where note like '%authorized:false%'\"
          ).fetchall()
          print(rows)
          "
      register: authz_denied_state
      changed_when: false

    - name: Assert the denied job is still pending with zero attempts after the 404 pass (M-A — re-poll never burns budget)
      ansible.builtin.assert:
        that:
          - "\"('pending', 0)\" in authz_denied_state.stdout"
        fail_msg: >-
          Attendu state=pending, attempts=0 (M-A -- le job authorized:false
          est re-polle a chaque passe --once, y compris la passe 404
          not_provisioned, et ne doit jamais consommer de tentative) :
          {{ authz_denied_state.stdout }}

    # Remet le stub en mode "authorized" avant le scenario suivant (401
    # invalid-token ci-dessous a besoin d'un stub qui repondrait 200 si
    # l'auth passait, pour prouver que c'est bien le token, pas le mode, qui
    # fait echouer la verification).
    - name: Restore the fetcher control-plane stub to authorized mode
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-authz-mode
        content: "true"
        mode: "0644"

    # --- M2 (revue 2026-08-03, cycle 4) : token invalide -> 401 fail-closed -

    - name: Count manifests before the invalid-token scenario (M2 — baseline)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/manifests
        patterns: "*.json"
      register: manifests_before_badtoken

    - name: Drop an Instagram job for the invalid-token scenario (M2 — 401 must fail closed, no acquisition)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-authz-badtoken.json
        content: |
          {"url": "https://www.instagram.com/operator_test/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: invalid fetcher badtoken (M2, CANARY-1b)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Run a worker pass with an INVALID control-plane token (M2 — 401 fail-closed, no acquisition)
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
        PRISME_FETCHER_TOKEN: wrong-token-does-not-match-stub-32c
      become: true
      become_user: prisme-fetcher
      changed_when: false

    - name: Verify the invalid-token job was NOT garbage-collected (fail-closed, never a terminal state)
      ansible.builtin.stat:
        path: /var/lib/prisme-fetcher/jobs/molecule-instagram-authz-badtoken.json
      register: authz_badtoken_job_leftover

    - name: Assert the invalid-token job stayed pending, never acquired
      ansible.builtin.assert:
        that:
          - authz_badtoken_job_leftover.stat.exists

    - name: Read the DB state for the invalid-token job (H2 — pending, zero attempts, never handle_failure)
      ansible.builtin.command:
        cmd: >-
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('/var/lib/prisme-fetcher/state.sqlite3')
          rows = conn.execute(
              \"select state, attempts from jobs where note like '%badtoken%'\"
          ).fetchall()
          print(rows)
          "
      register: authz_badtoken_state
      changed_when: false

    - name: Assert the invalid-token job is pending with zero attempts consumed (H2 — a control-plane auth failure never burns job budget)
      ansible.builtin.assert:
        that:
          - "\"('pending', 0)\" in authz_badtoken_state.stdout"
        fail_msg: >-
          Attendu state=pending, attempts=0 (H2 -- une panne de verification
          du control-plane -- ici 401 -- ne doit jamais consommer le budget
          de tentatives d'un job) : {{ authz_badtoken_state.stdout }}

    - name: Count manifests after the invalid-token scenario (M2 — must be unchanged, no acquisition attempted)
      ansible.builtin.find:
        paths: /var/lib/prisme-fetcher/manifests
        patterns: "*.json"
      register: manifests_after_badtoken

    - name: Assert no new manifest was created for the invalid-token job (fail-closed, no acquisition)
      ansible.builtin.assert:
        that:
          - manifests_after_badtoken.matched == manifests_before_badtoken.matched

    - name: Stop the fetcher control-plane stub (simulates control-plane unreachable)
      ansible.builtin.systemd_service:
        name: prisme-verify-authz.service
        state: stopped
      failed_when: false

    - name: Drop an Instagram job while the control-plane is unreachable (fail-closed, CANARY-1b)
      ansible.builtin.copy:
        dest: /var/lib/prisme-fetcher/jobs/molecule-instagram-authz-unreachable.json
        content: |
          {"url": "https://www.instagram.com/operator_test/", "adapter": "instagram", "handle": "operator_test", "note": "molecule verify: control-plane unreachable (CANARY-1b)"}
        owner: prisme-fetcher
        group: prisme-fetcher
        mode: "0640"

    - name: Run a worker pass while the control-plane is unreachable (H2, CANARY-1b — must NOT consume a job attempt)
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
        PRISME_FETCHER_TOKEN: molecule-fetcher-token-32-characters
      become: true
      become_user: prisme-fetcher
      changed_when: false
      register: authz_unreachable_run

    # H2 (revue 2026-08-03, cycle 4) : le seuil molecule est abaisse a 1
    # (converge.yml) -- une seule verification echouee dans cette passe doit
    # donc deja franchir le seuil et emettre l'evenement d'observabilite,
    # jamais un etat terminal/consommation d'attempts.
    #
    # Couverture (LOW, revue GO cycle 2) : seul le FRANCHISSEMENT du seuil
    # (consecutive_failures >= threshold) est prouve ici, avec un seuil
    # degrade a 1 pour rester leger en molecule -- une seule passe suffit,
    # pas besoin d'enchainer plusieurs echecs. Le sentinelle None (L1
    # ci-dessus, prisme-fetcher.py.j2) EST couvert par ce meme scenario : la
    # toute premiere alerte de ce banc traverse necessairement
    # last_alert_at is None. En revanche la PARCIMONIE (fenetre
    # INSTAGRAM_CONTROL_PLANE_ALERT_INTERVAL_SECONDS -- au plus 1 evenement
    # par intervalle, pas de re-alerte a chaque echec ulterieur) n'est
    # prouvee NULLE PART aujourd'hui (ni ici, ni au banc offline -- aucun
    # test unitaire Python n'existe pour _record_control_plane_failure, ce
    # module n'etant qu'un template Jinja2 sans suite pytest dediee).
    # Enchainer plusieurs echecs consecutifs dans la meme fenetre alourdirait
    # ce scenario molecule pour une garantie non triviale a verifier en
    # integration (horloge monotonic, timing best-effort) ; residuel a
    # honorer avant CANARY-5 si ce chemin devient critique en prod.
    - name: Assert the control-plane-unreachable event was emitted (H2 — observable, never destructive)
      ansible.builtin.assert:
        that:
          - "'instagram_control_plane_unreachable' in authz_unreachable_run.stdout"
        fail_msg: >-
          Attendu l'evenement JSON instagram_control_plane_unreachable dans
          stdout (H2 -- seuil molecule=1, cf converge.yml) :
          {{ authz_unreachable_run.stdout }}

    - name: Read the DB state for the unreachable-control-plane job (H2 — pending, zero attempts, never handle_failure)
      ansible.builtin.command:
        cmd: >-
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('/var/lib/prisme-fetcher/state.sqlite3')
          rows = conn.execute(
              \"select state, attempts, error from jobs where note like '%unreachable%'\"
          ).fetchall()
          print(rows)
          "
      register: authz_unreachable_state
      changed_when: false

    - name: Assert the unreachable-control-plane job stayed pending with zero attempts (H2 — a control-plane outage never burns job budget, never terminal)
      ansible.builtin.assert:
        that:
          - "\"('pending', 0, None)\" in authz_unreachable_state.stdout"
        fail_msg: >-
          Attendu state=pending, attempts=0, error=None (H2 -- une panne du
          control-plane ne doit JAMAIS passer par handle_failure : le job
          reste pending, observable uniquement via l'evenement
          instagram_control_plane_unreachable ci-dessus, jamais un
          retry_wait/failed) : {{ authz_unreachable_state.stdout }}

    # --- M2 (revue 2026-08-03, cycle 4) : heartbeat asserte via le journal --
    # jsonl du stub (chaque --once en mode INSTAGRAM_ENABLED envoie un
    # heartbeat "ready" synchrone au demarrage, cf main()/CANARY-1b) --
    # jusqu'ici, le stub etait muet et aucune assertion ne prouvait le
    # contrat heartbeat cote worker.

    - name: Slurp the fetcher control-plane stub request log (M2 — heartbeat contract asserted)
      ansible.builtin.slurp:
        src: /tmp/prisme-verify-http/authz_requests.jsonl
      register: authz_requests_raw

    - name: Assert at least one heartbeat POST was recorded with status=ready and a non-empty adapterVersion (M2)
      vars:
        _authz_lines: >-
          {{ (authz_requests_raw.content | b64decode).splitlines()
             | reject('equalto', '') | map('from_json') | list }}
        # Filtre d'abord sur la presence de "payload" (absente pour les
        # requetes rejetees en 401, cf stub) avant tout acces en profondeur —
        # un chainage direct 'payload.status' sur une entree sans cle
        # "payload" romprait le templating Jinja (AttributeError), jamais un
        # simple "false" silencieux.
        _heartbeat_posts_with_payload: >-
          {{ _authz_lines
             | selectattr('method', 'equalto', 'POST')
             | selectattr('payload', 'defined')
             | list }}
        _heartbeat_ready_events: >-
          {{ _heartbeat_posts_with_payload
             | selectattr('payload.status', 'defined')
             | selectattr('payload.status', 'equalto', 'ready')
             | selectattr('payload.adapterVersion', 'defined')
             | rejectattr('payload.adapterVersion', 'equalto', '')
             | list }}
      ansible.builtin.assert:
        that:
          - _heartbeat_ready_events | length >= 1
        fail_msg: >-
          Attendu au moins un POST heartbeat status=ready avec adapterVersion
          non vide dans le journal du stub (M2) — {{ _authz_lines | length }}
          requetes journalisees au total.

    # --- LOW (revue GO cycle 2) : heartbeat 404 not_provisioned -------------
    # Le heartbeat suit la meme doctrine C1 que l'authorization GET (cf plus
    # haut) : un 404 du control-plane est un etat SERVEUR attendu (connecteur
    # pas encore provisionne), jamais une panne generique. Preuve que le
    # worker distingue bien instagram_heartbeat_not_provisioned de
    # instagram_heartbeat_failed sur ce chemin precis.

    - name: Flip the fetcher control-plane stub to heartbeat_404 (LOW — heartbeat not_provisioned)
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-authz-mode
        content: "heartbeat_404"
        mode: "0644"

    - name: Run a worker pass while the control-plane heartbeat route reports 404 (LOW — instagram_heartbeat_not_provisioned)
      ansible.builtin.command:
        cmd: python3 /usr/local/libexec/prisme-fetcher --once
      environment:
        CREDENTIALS_DIRECTORY: /tmp/prisme-verify-creds
        PRISME_FETCHER_TOKEN: molecule-fetcher-token-32-characters
      become: true
      become_user: prisme-fetcher
      changed_when: false
      register: heartbeat_404_pass

    - name: Assert the worker emitted instagram_heartbeat_not_provisioned (LOW — never instagram_heartbeat_failed on a 404)
      ansible.builtin.assert:
        that:
          - "'\"event\": \"instagram_heartbeat_not_provisioned\"' in heartbeat_404_pass.stdout"
          - "'\"http_status\": 404' in heartbeat_404_pass.stdout"
          - "'\"error\":' in heartbeat_404_pass.stdout"
        fail_msg: >-
          Attendu l'evenement instagram_heartbeat_not_provisioned avec
          http_status=404 et une cle "error" non vide (HTTPError.reason,
          cf send_instagram_heartbeat) dans le stdout du worker : {{
          heartbeat_404_pass.stdout }}

    - name: Restore the fetcher control-plane stub to authorized mode (cleanup after LOW heartbeat_404)
      ansible.builtin.copy:
        dest: /tmp/prisme-verify-authz-mode
        content: "true"
        mode: "0644"
